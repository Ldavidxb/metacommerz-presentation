<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — GxP Signature Integrity & CRO Quantum Risk · Takeda</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060B; --surface: #0E0E16; --surface2: #16161F; --surface3: #1C1C28;
    --border: #252535; --border-light: #2E2E40;
    --emerald: #34D399; --emerald-dim: rgba(52,211,153,0.12);
    --red: #F87171; --red-dim: rgba(248,113,113,0.12);
    --amber: #FBBF24; --amber-dim: rgba(251,191,36,0.12);
    --cyan: #22D3EE; --cyan-dim: rgba(34,211,238,0.12);
    --blue: #60A5FA; --blue-dim: rgba(96,165,250,0.12);
    --purple: #A78BFA; --sky: #38BDF8; --sky-dim: rgba(56,189,248,0.12);
    --white: #F0EDE6; --muted: #8E8EA3; --dim: #55556A;
    --fd: 'Space Grotesk', sans-serif; --fb: 'DM Sans', sans-serif; --fm: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--white); font-family: var(--fb); overflow-x: hidden; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.4s ease-out both; }
  .app { display: flex; min-height: 100vh; }

  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .brand { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-mark { width: 26px; height: 26px; border: 2px solid var(--emerald); border-radius: 7px; display:flex; align-items:center; justify-content:center; }
  .brand-mark div { width: 9px; height: 9px; background: var(--emerald); border-radius: 2px; }
  .brand-name { font-family: var(--fd); font-weight: 700; font-size: 14.5px; color: var(--emerald); letter-spacing: 0.03em; }
  .brand-sub { font-size: 10.5px; color: var(--dim); margin-left: 36px; }
  .context-box { margin: 16px 18px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .context-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .context-val { font-size: 12.5px; color: var(--white); font-weight: 600; line-height: 1.4; }

  .steps { padding: 8px 12px; flex: 1; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
  .step:hover { background: var(--surface2); }
  .step.active { background: var(--emerald-dim); }
  .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; font-family: var(--fm); flex-shrink: 0; border: 1.5px solid var(--border-light); color: var(--dim); }
  .step.done .step-num { background: var(--emerald); border-color: var(--emerald); color: #04140d; }
  .step.active .step-num { border-color: var(--emerald); color: var(--emerald); }
  .step-label { font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .step.active .step-label, .step.done .step-label { color: var(--white); }
  .step.locked { opacity: 0.35; pointer-events: none; }

  .checklist-mini { margin: 10px 18px 20px; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .checklist-mini-title { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display:flex; justify-content:space-between; }
  .mini-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--muted); }
  .mini-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.4s; }
  .mini-dot.on { background: var(--emerald); }
  .mini-row.on { color: var(--white); }

  .main { margin-left: 280px; flex: 1; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(6,6,11,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 40px; display:flex; align-items:center; justify-content: space-between; }
  .topbar-title { font-family: var(--fd); font-weight: 700; font-size: 17px; }
  .topbar-badge { font-family: var(--fm); font-size: 11px; color: var(--sky); background: var(--sky-dim); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(56,189,248,0.25); }
  .content { padding: 40px; max-width: 1100px; }

  h1.screen-title { font-family: var(--fd); font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .screen-sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; max-width: 700px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

  .kv-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-key { color: var(--dim); }
  .kv-val { font-family: var(--fm); color: var(--white); font-weight: 500; }

  .progress-track { height: 8px; background: var(--surface3); border-radius: 100px; overflow: hidden; margin: 14px 0; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sky), var(--emerald)); border-radius: 100px; width: 0%; transition: width 2s cubic-bezier(.2,.8,.2,1); }

  .btn { font-family: var(--fd); font-weight: 600; font-size: 14.5px; padding: 13px 26px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--emerald); color: #04140d; }
  .btn-primary:hover { background: #4fe3ab; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--surface3); color: var(--dim); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--white); }
  .btn-ghost:hover { border-color: var(--emerald); }

  .callout { padding: 14px 18px; border-radius: 10px; border-left: 3px solid var(--emerald); background: rgba(52,211,153,0.06); font-size: 13.5px; color: var(--white); line-height: 1.6; margin: 18px 0; }
  .callout.sky { border-left-color: var(--sky); background: rgba(56,189,248,0.06); }
  .callout.red { border-left-color: var(--red); background: rgba(248,113,113,0.06); }
  .callout strong { color: var(--emerald); }
  .callout.sky strong { color: var(--sky); }
  .callout.red strong { color: var(--red); }

  .fleet-stat { text-align: center; padding: 22px; background: var(--surface2); border-radius: 12px; border: 1px solid var(--border); }
  .fleet-num { font-family: var(--fm); font-size: 27px; font-weight: 700; }
  .fleet-label { font-size: 11.5px; color: var(--dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(4,20,13,0.3); border-top-color: #04140d; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .banner-done { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--emerald-dim); border: 1px solid rgba(52,211,153,0.3); border-radius: 12px; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--emerald); }

  .row-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface2); border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
  .row-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .row-info { flex: 1; }
  .row-title { font-size: 13.5px; font-weight: 600; }
  .row-desc { font-size: 11.5px; color: var(--dim); }
  .row-status { font-family: var(--fm); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600; }

  .risk-bar { height: 10px; border-radius: 100px; overflow: hidden; margin: 8px 0; display:flex; }
  .risk-bar div { height: 100%; }

  .zip-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--surface2); border-radius: 9px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 13.5px; }
  .zip-icon { color: var(--emerald); font-family: var(--fm); font-size: 15px; }

  .cta-strip { margin-top: 40px; padding: 28px; background: linear-gradient(135deg, rgba(56,189,248,0.06), rgba(52,211,153,0.06)); border: 1px solid var(--border-light); border-radius: 14px; text-align: center; }
  .cta-strip h3 { font-family: var(--fd); font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .cta-strip p { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .cta-strip .cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cta-strip a { text-decoration: none; }

  .lang-picker { display: flex; align-items: center; gap: 0; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; margin-left: 12px; flex-shrink: 0; }
  .lang-btn { font-family: var(--fm); font-size: 11px; padding: 5px 10px; background: transparent; border: none; color: var(--dim); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .lang-btn.active { background: var(--emerald-dim); color: var(--emerald); }
  .lang-btn:hover:not(.active) { color: var(--white); }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="26" height="26"><circle cx="24" cy="24" r="22" stroke="#34D399" stroke-width="1.5" fill="none" opacity="0.9"/><line x1="24" y1="4" x2="24" y2="44" stroke="#34D399" stroke-width="1.2" opacity="0.85"/><line x1="4" y1="24" x2="44" y2="24" stroke="#34D399" stroke-width="1.2" opacity="0.85"/><line x1="9.86" y1="9.86" x2="38.14" y2="38.14" stroke="#34D399" stroke-width="1" opacity="0.75"/><line x1="38.14" y1="9.86" x2="9.86" y2="38.14" stroke="#34D399" stroke-width="1" opacity="0.75"/><polygon points="24,6 30,18 24,14 18,18" fill="#34D399" opacity="0.9"/><polygon points="24,42 30,30 24,34 18,30" fill="#34D399" opacity="0.9"/><polygon points="6,24 18,18 14,24 18,30" fill="#34D399" opacity="0.9"/><polygon points="42,24 30,18 34,24 30,30" fill="#34D399" opacity="0.9"/><circle cx="24" cy="24" r="4" fill="#34D399" opacity="0.9"/><circle cx="24" cy="24" r="10" stroke="#34D399" stroke-width="0.8" fill="none" opacity="0.5"/></svg>
        <span class="brand-name">agenticvaults</span>
      </div>
      <div class="brand-sub">SENTINEL · Signature Integrity</div>
    </div>
    <div class="context-box">
      <div class="context-label">Prospect Walkthrough</div>
      <div class="context-val">Takeda — GxP Signature Integrity & CRO Quantum Risk</div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="checklist-mini">
      <div class="checklist-mini-title"><span>PQC Migration</span><span id="miniCount">0/6</span></div>
      <div id="miniList"></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topTitle">Cryptographic Asset Discovery</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="topbar-badge" id="topBadge">Enterprise · 34 Sites</div>
        <div class="lang-picker">
          <button class="lang-btn active" id="langEn" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="langJa" onclick="setLang('ja')">日本語</button>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
let lang = 'en';
function setLang(l) {
  lang = l;
  document.getElementById('langEn').classList.toggle('active', l === 'en');
  document.getElementById('langJa').classList.toggle('active', l === 'ja');
  render();
}

function getReqs() {
  const ja = lang === 'ja';
  return [
    {code: '1', label: ja ? '暗号資産棚卸完了' : 'Crypto inventory complete'},
    {code: '2', label: ja ? 'CROリスク評価済' : 'CRO risk assessed'},
    {code: '3', label: ja ? 'アクティブ記録PQ署名済' : 'Active records PQ-signed'},
    {code: '4', label: ja ? '多法域署名稼働中' : 'Multi-jurisdiction signing live'},
    {code: '5', label: ja ? '証明書ライフサイクル管理中' : 'Certificate lifecycle managed'},
    {code: '6', label: ja ? 'レガシー整合性復元済' : 'Legacy integrity restored'},
  ];
}
function getStepLabels() {
  const ja = lang === 'ja';
  return [
    ja ? '暗号資産ディスカバリー' : 'Cryptographic Asset Discovery',
    ja ? 'CROリスクダッシュボード' : 'Third-Party / CRO Risk Dashboard',
    ja ? 'PQC移行計画' : 'PQC Migration Planning',
    ja ? '署名サービス（バッチリリース）' : 'Sign-as-Service (Batch Release)',
    ja ? '証明書ライフサイクル自動化' : 'Certificate Lifecycle Automation',
    ja ? 'Sentinel：整合性監視' : 'Sentinel: Integrity Monitoring',
    ja ? '規制当局申請署名' : 'Regulatory Submission Signing',
    ja ? 'CISOエグゼクティブダッシュボード' : 'CISO Executive Dashboard',
  ];
}

let state = { screen: 1, maxUnlocked: 1, reqStatus: [false,false,false,false,false,false] };
function setReq(idx, val) { state.reqStatus[idx] = val; renderSidebar(); }
function goTo(n) { if (n > state.maxUnlocked) return; state.screen = n; render(); }
function unlockNext() { state.maxUnlocked = Math.max(state.maxUnlocked, state.screen + 1); }

function renderSidebar() {
  const ja = lang === 'ja';
  const stepLabels = getStepLabels();
  const reqs = getReqs();
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = stepLabels.map((label, i) => {
    const n = i + 1;
    const cls = ['step'];
    if (n === state.screen) cls.push('active');
    else if (n < state.screen) cls.push('done');
    if (n > state.maxUnlocked) cls.push('locked');
    return `<div class="${cls.join(' ')}" onclick="goTo(${n})">
      <div class="step-num">${n < state.screen ? '✓' : n}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');
  const doneCount = state.reqStatus.filter(Boolean).length;
  document.getElementById('miniCount').textContent = doneCount + '/6';
  document.getElementById('miniList').innerHTML = reqs.map((r, i) => {
    const on = state.reqStatus[i];
    return `<div class="mini-row ${on ? 'on' : ''}"><div class="mini-dot ${on ? 'on' : ''}"></div>${r.label}</div>`;
  }).join('');
  document.querySelector('.checklist-mini-title span').textContent = ja ? 'PQC移行チェックリスト' : 'PQC Migration';
  document.querySelector('.context-label').textContent = ja ? '見込み客向けウォークスルー' : 'Prospect Walkthrough';
  document.querySelector('.context-val').textContent = ja ? 'Takeda — GxP署名整合性とCRO量子リスク' : 'Takeda — GxP Signature Integrity & CRO Quantum Risk';
  document.getElementById('topBadge').textContent = ja ? 'Enterprise · 34拠点' : 'Enterprise · 34 Sites';
}

function screen1() {
  const ja = lang === 'ja';
  return `
  <h1 class="screen-title">${ja ? '暗号資産ディスカバリー' : 'Cryptographic Asset Discovery'}</h1>
  <p class="screen-sub">${ja ? 'SBOMモジュールがTakedaのGxP環境全体をスキャン完了 — 製造拠点34箇所、継承PKI 4系統（Baxter + Shire + Nycomed + Takeda旧来）、署名済み記録230万件。' : "SBOM module has scanned Takeda's entire GxP landscape — 34 manufacturing sites, 4 inherited PKIs (Baxter + Shire + Nycomed + Takeda-legacy), 2.3 million signed records."}</p>
  <div class="grid-4" style="margin-bottom:24px;">
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--sky);">34</div><div class="fleet-label">${ja ? '製造拠点' : 'Manufacturing Sites'}</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--amber);">2.3M</div><div class="fleet-label">${ja ? 'GxP署名済み記録' : 'Signed GxP Records'}</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--red);">47K</div><div class="fleet-label">${ja ? 'オペレーター証明書' : 'Operator Certificates'}</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--purple);">4</div><div class="fleet-label">${ja ? '継承PKIシステム' : 'Inherited PKI Systems'}</div></div>
  </div>
  <div class="card">
    <div style="font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:14px;">${ja ? '署名アルゴリズム分布' : 'Signature Algorithm Distribution'}</div>
    <div class="risk-bar">
      <div style="width:78%; background:var(--red); border-radius:100px 0 0 100px;"></div>
      <div style="width:19%; background:var(--amber);"></div>
      <div style="width:3%; background:var(--emerald); border-radius:0 100px 100px 0;"></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:11px; margin-top:6px;">
      <span style="color:var(--red);">RSA-2048 — 78% (${ja ? '2033年までに量子脆弱' : 'quantum-vulnerable by 2033'})</span>
      <span style="color:var(--amber);">ECDSA P-256 — 19%</span>
      <span style="color:var(--emerald);">ML-DSA — 3%</span>
    </div>
    <div class="kv-row" style="margin-top:16px;"><span class="kv-key">${ja ? '推定リスク額' : 'Estimated exposure'}</span><span class="kv-val" style="color:var(--red);">${ja ? '脆弱な署名に依存する製品価値42億ドル' : '$4.2B in product value on vulnerable signatures'}</span></div>
    <div class="kv-row"><span class="kv-key">${ja ? 'PKI出元' : 'PKI sources'}</span><span class="kv-val">Baxter (2004) + Shire (2008) + Nycomed (2011) + Takeda (2014)</span></div>
    <div class="kv-row"><span class="kv-key">${ja ? '断片化リスク' : 'Fragmentation risk'}</span><span class="kv-val" style="color:var(--red);">${ja ? '2026年5月に4,500名解雇 — PKI知識が流出' : '4,500 employees laid off May 2026 — PKI knowledge walking out'}</span></div>
  </div>
  <div class="callout red">
    <strong>${ja ? '脅威モデル：' : 'The threat model:'}</strong> ${ja ? '国家レベルの攻撃者が本日のRSA-2048署名付きバッチ記録を取得。2033年に偽造署名で不正なENTYVIOロットをサプライチェーンに挿入。偽造記録は真正品と区別不可能。製品特許存続期間中、古典的署名アルゴリズムではこれを防止できません。' : "A nation-state adversary captures signed batch records today (RSA-2048). In 2033, they forge a signature on a counterfeit batch record — inserting a fake ENTYVIO lot into the supply chain. The forged record is indistinguishable from a genuine one. No classical signature algorithm prevents this within the product's patent life."}
  </div>
  <div style="margin-top:16px;" id="scanArea">
    <button class="btn btn-primary" id="scanBtn" onclick="runScan()">${ja ? 'ディスカバリースキャン実行' : 'Complete Discovery Scan'}</button>
  </div>
  <div id="s1done" style="display:none;">
    <div class="banner-done">${ja ? '✓ 暗号資産棚卸完了 — 230万件マッピング、PKI 4系統カタログ化、リスク定量化' : '✓ Full cryptographic inventory — 2.3M records mapped, 4 PKIs cataloged, risk quantified'}</div>
    <div style="margin-top:20px;"><button class="btn btn-primary" onclick="setReq(0,true); unlockNext(); goTo(2)">${ja ? 'CROリスクダッシュボードを表示 →' : 'View CRO Risk Dashboard →'}</button></div>
  </div>`;
}
function runScan() {
  const ja = lang === 'ja';
  document.getElementById('scanBtn').innerHTML = `<span class="spinner"></span> ${ja ? '34拠点スキャン中…' : 'Scanning 34 sites…'}`;
  document.getElementById('scanBtn').disabled = true;
  setTimeout(() => {
    document.getElementById('scanArea').style.display = 'none';
    document.getElementById('s1done').style.display = 'block';
  }, 1600);
}

function screen2() {
  const ja = lang === 'ja';
  return `
  <h1 class="screen-title">${ja ? 'CROリスクダッシュボード' : 'Third-Party / CRO Risk Dashboard'}</h1>
  <p class="screen-sub">${ja ? 'TakedaはCROが保有する署名付き臨床試験報告書に依存しています。CROのPKIはTakedaの管理外です。CROの鍵が量子攻撃で突破された場合、Takeda向けの全CSRが疑義対象となります。' : "Takeda relies on CROs who hold signed clinical study reports. Their PKI is outside Takeda's control. If their keys are quantum-broken, every CSR they signed for Takeda becomes suspect."}</p>
  <div class="card">
    <div style="font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:14px;">${ja ? '主要CRO/CMOパートナー — 暗号リスク' : 'Top CRO/CMO Partners — Cryptographic Risk'}</div>
