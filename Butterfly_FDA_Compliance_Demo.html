<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — FDA Cybersecurity Compliance Workflow · Butterfly Network</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060B; --surface: #0E0E16; --surface2: #16161F; --surface3: #1C1C28;
    --border: #252535; --border-light: #2E2E40;
    --emerald: #34D399; --emerald-dim: rgba(52,211,153,0.12);
    --red: #F87171; --red-dim: rgba(248,113,113,0.12);
    --amber: #FBBF24; --cyan: #22D3EE; --blue: #60A5FA; --purple: #A78BFA;
    --white: #F0EDE6; --muted: #8E8EA3; --dim: #55556A;
    --fd: 'Space Grotesk', sans-serif; --fb: 'DM Sans', sans-serif; --fm: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--white); font-family: var(--fb); overflow-x: hidden; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes checkPop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .fade-in { animation: fadeIn 0.4s ease-out both; }
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .brand { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-mark { width: 26px; height: 26px; border: 2px solid var(--emerald); border-radius: 7px; display:flex; align-items:center; justify-content:center; }
  .brand-mark div { width: 9px; height: 9px; background: var(--emerald); border-radius: 2px; }
  .brand-name { font-family: var(--fd); font-weight: 700; font-size: 14.5px; color: var(--emerald); letter-spacing: 0.03em; }
  .brand-sub { font-size: 10.5px; color: var(--dim); margin-left: 36px; }
  .context-box { margin: 16px 18px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .context-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .context-val { font-size: 12.5px; color: var(--white); font-weight: 600; line-height: 1.4; }

  .steps { padding: 8px 12px; flex: 1; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
  .step:hover { background: var(--surface2); }
  .step.active { background: var(--emerald-dim); }
  .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; font-family: var(--fm); flex-shrink: 0; border: 1.5px solid var(--border-light); color: var(--dim); }
  .step.done .step-num { background: var(--emerald); border-color: var(--emerald); color: #04140d; }
  .step.active .step-num { border-color: var(--emerald); color: var(--emerald); }
  .step-label { font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .step.active .step-label, .step.done .step-label { color: var(--white); }
  .step.locked { opacity: 0.35; pointer-events: none; }

  .checklist-mini { margin: 10px 18px 20px; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .checklist-mini-title { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display:flex; justify-content:space-between; }
  .mini-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--muted); }
  .mini-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.4s; }
  .mini-dot.on { background: var(--emerald); }
  .mini-row.on { color: var(--white); }

  /* Main */
  .main { margin-left: 280px; flex: 1; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(6,6,11,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 40px; display:flex; align-items:center; justify-content: space-between; }
  .topbar-title { font-family: var(--fd); font-weight: 700; font-size: 17px; }
  .topbar-badge { font-family: var(--fm); font-size: 11px; color: var(--emerald); background: var(--emerald-dim); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(52,211,153,0.25); }
  .content { padding: 40px; max-width: 1100px; }

  h1.screen-title { font-family: var(--fd); font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .screen-sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; max-width: 700px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* Device fleet cards */
  .device-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .device-card:hover { border-color: var(--emerald); transform: translateY(-2px); }
  .device-card.selected { border-color: var(--emerald); box-shadow: 0 0 0 1px var(--emerald); }
  .device-name { font-family: var(--fd); font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .device-meta { font-size: 12.5px; color: var(--dim); font-family: var(--fm); margin-bottom: 18px; }
  .score-ring { position: relative; width: 84px; height: 84px; margin-bottom: 10px; }
  .score-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fm); font-weight: 700; font-size: 19px; }
  .score-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .click-hint { font-size: 12px; color: var(--emerald); font-weight: 600; margin-top: 14px; display: flex; align-items: center; gap: 6px; }

  /* Checklist table */
  .req-table { width: 100%; border-collapse: collapse; }
  .req-table td { padding: 15px 18px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .req-table tr:last-child td { border-bottom: none; }
  .req-code { font-family: var(--fm); color: var(--dim); font-size: 12px; margin-right: 8px; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-size: 11.5px; font-weight: 600; font-family: var(--fm); white-space: nowrap; }
  .status-pill.pending { background: var(--red-dim); color: var(--red); }
  .status-pill.done { background: var(--emerald-dim); color: var(--emerald); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-dot.done-pop { animation: checkPop 0.4s ease-out; }

  /* Buttons */
  .btn { font-family: var(--fd); font-weight: 600; font-size: 14.5px; padding: 13px 26px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--emerald); color: #04140d; }
  .btn-primary:hover { background: #4fe3ab; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--surface3); color: var(--dim); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--white); }
  .btn-ghost:hover { border-color: var(--emerald); }

  /* Progress / scan */
  .progress-track { height: 8px; background: var(--surface3); border-radius: 100px; overflow: hidden; margin: 14px 0; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--emerald)); border-radius: 100px; width: 0%; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .vuln-row { display: flex; gap: 14px; margin: 18px 0; }
  .vuln-chip { flex: 1; text-align: center; padding: 16px; background: var(--surface2); border-radius: 10px; border: 1px solid var(--border); }
  .vuln-num { font-family: var(--fm); font-size: 24px; font-weight: 700; }
  .vuln-label { font-size: 11px; color: var(--dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  .kv-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-key { color: var(--dim); }
  .kv-val { font-family: var(--fm); color: var(--white); font-weight: 500; }

  .signer-row { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--surface2); border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
  .signer-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .signer-info { flex: 1; }
  .signer-name { font-size: 13.5px; font-weight: 600; }
  .signer-role { font-size: 11.5px; color: var(--dim); }
  .signer-status { font-family: var(--fm); font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 100px; }

  .kat-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; background: var(--surface2); border-radius: 9px; margin-bottom: 8px; border: 1px solid var(--border); font-family: var(--fm); font-size: 13px; }

  .zip-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--surface2); border-radius: 9px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 13.5px; }
  .zip-icon { color: var(--emerald); font-family: var(--fm); font-size: 15px; }

  .fleet-stat { text-align: center; padding: 22px; background: var(--surface2); border-radius: 12px; border: 1px solid var(--border); }
  .fleet-num { font-family: var(--fm); font-size: 27px; font-weight: 700; }
  .fleet-label { font-size: 11.5px; color: var(--dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

  .callout { padding: 14px 18px; border-radius: 10px; border-left: 3px solid var(--emerald); background: rgba(52,211,153,0.06); font-size: 13.5px; color: var(--white); line-height: 1.6; margin: 18px 0; }
  .callout.blue { border-left-color: var(--blue); background: rgba(96,165,250,0.06); }
  .callout strong { color: var(--emerald); }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(4,20,13,0.3); border-top-color: #04140d; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .banner-done { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--emerald-dim); border: 1px solid rgba(52,211,153,0.3); border-radius: 12px; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--emerald); }

/* ─── Responsive base fixes ─── */
img, video, svg { max-width: 100%; }
.content { box-sizing: border-box; width: 100%; }
pre, code, .kv-val { word-break: break-all; overflow-wrap: break-word; }
table { table-layout: auto; }
.topbar { gap: 8px; }

/* ─── Hamburger ─── */
.hamburger { display: none; background: none; border: none; color: var(--white); font-size: 22px; cursor: pointer; padding: 4px 8px; margin-right: 10px; line-height: 1; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }

/* ─── Sidebar overlay ─── */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 49; }
.sidebar-overlay.active { display: block; }

/* ─── Desktop: sidebar visible ─── */
@media(min-width:1025px) {
  .hamburger { display: none !important; }
  .sidebar { transform: none !important; }
  .main { margin-left: 280px !important; }
}

/* ─── Tablet & below: sidebar off-canvas ─── */
@media(max-width:1024px) {
  .hamburger { display: block; }
  .sidebar { transform: translateX(-100%); transition: transform .25s ease; z-index: 50; width: 280px; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0 !important; }
  .topbar { padding: 12px 16px; }
  .content { padding: 24px 20px; max-width: 100%; }
  h1.screen-title { font-size: 22px; }
  .screen-sub { font-size: 13.5px; }
  .grid-2 { grid-template-columns: 1fr 1fr; gap: 16px; }
}

/* ─── Mobile: collapse grids and tighten layout ─── */
@media(max-width:768px) {
  .grid-2 { grid-template-columns: 1fr !important; gap: 14px; }
  .content { padding: 16px 14px; }
  h1.screen-title { font-size: 20px; }
  .screen-sub { font-size: 13px; margin-bottom: 20px; }
  .card { padding: 16px 14px; }
  .btn { font-size: 13px; padding: 11px 18px; width: 100%; justify-content: center; box-sizing: border-box; }
  .btn + .btn { margin-top: 8px; }
  .kv-row { font-size: 12px; flex-wrap: wrap; gap: 4px; }
  .kv-key { min-width: 120px; }
  .kv-val { font-size: 11px; }
  .req-table td { padding: 10px 10px; font-size: 12px; }
  .req-table { font-size: 12px; width: 100%; }
  .checklist-mini { margin: 8px 12px 14px; }
  .signer-row { flex-wrap: wrap; gap: 8px; }
  .signer-status { font-size: 10.5px; padding: 4px 10px; }
  .kat-row { font-size: 11.5px; padding: 9px 12px; flex-wrap: wrap; gap: 6px; }
  .zip-item { font-size: 12px; }
  .fleet-stat { padding: 14px; }
  .fleet-num { font-size: 22px; }
  .vuln-row { flex-wrap: wrap; gap: 10px; }
  .vuln-chip { min-width: calc(50% - 7px); flex: 1 1 calc(50% - 7px); }
  .score-ring { width: 66px; height: 66px; }
  .device-name { font-size: 17px; }
  .topbar-badge { font-size: 10px; padding: 4px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .topbar-title { font-size: 14px; }
  .status-pill { font-size: 10.5px; padding: 4px 9px; }
  .callout { font-size: 12.5px; padding: 12px 14px; }
  .banner-done { font-size: 13px; padding: 13px 16px; flex-wrap: wrap; gap: 6px; }
  /* table overflow for narrow screens */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 360px; font-size: 11px; }
}

/* ─── Very small phones ─── */
@media(max-width:400px) {
  .content { padding: 12px 10px; }
  h1.screen-title { font-size: 18px; }
  .topbar-badge { display: none; }
  .brand-name { font-size: 13px; }
  .vuln-chip { min-width: 100%; }
}

/* ─── Cross-browser fixes ─── */
.btn { -webkit-appearance: none; appearance: none; }
.sidebar { -webkit-overflow-scrolling: touch; }
.progress-fill { -webkit-transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
@supports not (backdrop-filter: blur(12px)) {
  .topbar { background: rgba(6,6,11,0.97); }
}
/* Prevent iOS font size bump on orientation change */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark"><div></div></div>
        <span class="brand-name">agenticvaults</span>
      </div>
      <div class="brand-sub">SENTINEL · Compliance Automation</div>
    </div>
    <div class="context-box">
      <div class="context-label">Prospect Walkthrough</div>
      <div class="context-val">Butterfly Network — FDA 510(k) Cybersecurity Submission</div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="checklist-mini">
      <div class="checklist-mini-title"><span>FDA Checklist</span><span id="miniCount">0/7</span></div>
      <div id="miniList"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="topbar-title" id="topTitle">Device Fleet Overview</div>
      </div>
      <div class="topbar-badge" id="topBadge">iQ4 · Premarket</div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>

<script>
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}
// ---------- State ----------
const REQS = [
  {code: '§5.1', label: 'SBOM provided'},
  {code: '§5.2', label: 'Known vulnerabilities addressed'},
  {code: '§5.3', label: 'Cryptographic integrity of software'},
  {code: '§5.4', label: 'Device authentication'},
  {code: '§5.5', label: 'Data-at-rest protection'},
  {code: '§5.6', label: 'Firmware update mechanism'},
  {code: '§5.7', label: 'Cryptographic module validation'},
];
const STEP_LABELS = [
  'Device Fleet Overview',
  'FDA Compliance Checklist',
  'SBOM Generation & ZK Proof',
  'Firmware Signing Ceremony',
  'Device Identity Provisioning',
  'FIPS 140-3 Evidence Package',
  'Submission Package',
  'Post-Market Monitoring',
];

let state = {
  screen: 1,
  maxUnlocked: 1,
  reqStatus: [false,false,false,false,false,false,false], // index = req index
  scanDone: false,
  zkDone: false,
  signers: [false, false, false], // VP Eng, Security Lead, QA Director
  provisionDone: false,
  katDone: false,
  submissionGenerated: false,
};

function setReq(idx, val) { state.reqStatus[idx] = val; renderSidebar(); }

function goTo(n) {
  closeSidebar();
  if (n > state.maxUnlocked) return;
  state.screen = n;
  if (n > state.maxUnlocked) state.maxUnlocked = n;
  render();
}
function unlockNext() {
  state.maxUnlocked = Math.max(state.maxUnlocked, state.screen + 1);
}

// ---------- Sidebar ----------
function renderSidebar() {
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    const cls = ['step'];
    if (n === state.screen) cls.push('active');
    else if (n < state.screen || (n <= state.maxUnlocked && n < state.screen)) cls.push('done');
    if (n > state.maxUnlocked) cls.push('locked');
    const numContent = (n < state.screen) ? '✓' : n;
    return `<div class="${cls.join(' ')}" onclick="goTo(${n})">
      <div class="step-num">${numContent}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');

  const doneCount = state.reqStatus.filter(Boolean).length;
  document.getElementById('miniCount').textContent = doneCount + '/7';
  document.getElementById('miniList').innerHTML = REQS.map((r, i) => {
    const on = state.reqStatus[i];
    return `<div class="mini-row ${on ? 'on' : ''}"><div class="mini-dot ${on ? 'on' : ''}"></div>${r.code} ${r.label}</div>`;
  }).join('');
}

// ---------- Screens ----------
function screen1() {
  return `
  <h1 class="screen-title">Device Fleet Overview</h1>
  <p class="screen-sub">Your product lines, each with a live cybersecurity readiness score computed from cryptographic posture, SBOM completeness, and FDA submission status.</p>
  <div class="grid-2">
    <div class="device-card">
      <div class="device-name">iQ3</div>
      <div class="device-meta">SHIPPING · 280,000 UNITS IN FIELD</div>
      <div style="display:flex; align-items:center; gap:18px;">
        <svg class="score-ring" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#252535" stroke-width="8"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="#FBBF24" stroke-width="8" stroke-dasharray="226" stroke-dashoffset="${226 - 226*0.62}" stroke-linecap="round" transform="rotate(-90 42 42)"/>
        </svg>
        <div>
          <div style="font-family:var(--fm); font-size:26px; font-weight:700; color:var(--amber);">62%</div>
          <div class="score-label">Readiness</div>
          <div style="font-size:11.5px; color:var(--dim); margin-top:4px;">Legacy · RSA-2048</div>
        </div>
      </div>
    </div>
    <div class="device-card" id="iq4card" onclick="selectIQ4()">
      <div class="device-name">iQ4</div>
      <div class="device-meta">PREMARKET · 500 BETA UNITS</div>
      <div style="display:flex; align-items:center; gap:18px;">
        <svg class="score-ring" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#252535" stroke-width="8"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="#F87171" stroke-width="8" stroke-dasharray="226" stroke-dashoffset="${226 - 226*0.34}" stroke-linecap="round" transform="rotate(-90 42 42)"/>
        </svg>
        <div>
          <div style="font-family:var(--fm); font-size:26px; font-weight:700; color:var(--red);">34%</div>
          <div class="score-label">Readiness</div>
          <div style="font-size:11.5px; color:var(--dim); margin-top:4px;">FDA submission blocked</div>
        </div>
      </div>
      <div class="click-hint">→ Click to begin FDA cybersecurity submission</div>
    </div>
  </div>`;
}
function selectIQ4() { unlockNext(); goTo(2); }

function screen2() {
  const rows = REQS.map((r, i) => {
    const on = state.reqStatus[i];
    return `<tr>
      <td style="width:70%;"><span class="req-code">${r.code}</span>${r.label}</td>
      <td style="text-align:right;"><span class="status-pill ${on ? 'done' : 'pending'}"><span class="status-dot ${on ? 'done-pop' : ''}"></span>${on ? 'Complete' : 'Not started'}</span></td>
    </tr>`;
  }).join('');
  return `

// ── Collapse inline multi-column grids on small screens ──────────────────────
function applyResponsive() {
  const mobile = window.innerWidth <= 768;
  const tablet = window.innerWidth <= 1024;
  // Wrap any bare <table> elements in overflow container
  document.querySelectorAll('.content table').forEach(t => {
    if (!t.closest('.table-wrap')) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    }
  });
  // Collapse inline 3-column grids on mobile
  if (mobile) {
    document.querySelectorAll('[style*="grid-template-columns: 1fr 1fr 1fr"], [style*="grid-template-columns:1fr 1fr 1fr"], [style*="repeat(3, 1fr)"], [style*="repeat(3,1fr)"]').forEach(el => {
      el.style.gridTemplateColumns = '1fr';
    });
    // Collapse inline 2-column grids within .content on mobile too
    document.querySelectorAll('.content [style*="grid-template-columns: 1fr 1fr"]').forEach(el => {
      el.style.gridTemplateColumns = '1fr';
    });
    // Make button groups flex-column
    document.querySelectorAll('.content [style*="display:flex"][style*="gap"]').forEach(el => {
      if (el.querySelectorAll('.btn').length > 1) {
        el.style.flexDirection = 'column';
      }
    });
  }
}
window.addEventListener('resize', () => { if (document.getElementById('content')) applyResponsive(); });

render();
