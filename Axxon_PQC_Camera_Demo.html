<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — Quantum-Safe Camera Fleet Security · Axxon One</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#06060B;--surface:#0E0E16;--surface2:#16161F;--surface3:#1C1C28;
    --border:#252535;--border-light:#2E2E40;
    --emerald:#34D399;--emerald-dim:rgba(52,211,153,0.12);
    --red:#F87171;--red-dim:rgba(248,113,113,0.12);
    --amber:#FBBF24;--amber-dim:rgba(251,191,36,0.12);
    --cyan:#22D3EE;--cyan-dim:rgba(34,211,238,0.12);
    --blue:#60A5FA;--blue-dim:rgba(96,165,250,0.12);
    --purple:#A78BFA;--purple-dim:rgba(167,139,250,0.12);
    --indigo:#6366F1;--indigo-dim:rgba(99,102,241,0.12);
    --white:#F0EDE6;--muted:#8E8EA3;--dim:#55556A;
    --fd:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--white);font-family:var(--fb);overflow-x:hidden;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes scanLine{0%{top:-4px}100%{top:100%}}
  @keyframes dataFlow{0%{opacity:0;transform:translateX(0)}50%{opacity:1}100%{opacity:0;transform:translateX(60px)}}
  @keyframes encBlink{0%,100%{background:var(--emerald-dim);border-color:rgba(52,211,153,.3)}50%{background:rgba(52,211,153,.22);border-color:rgba(52,211,153,.6)}}
  .fade-in{animation:fadeIn .4s ease-out both}
  .app{display:flex;min-height:100vh}

  /* Sidebar */
  .sidebar{width:272px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto}
  .brand{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
  .brand-row{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .brand-mark { display: none; }
  .brand-mark div{width:8px;height:8px;background:var(--indigo);border-radius:2px}
  .brand-name{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--indigo);letter-spacing:.03em}
  .brand-sub{font-size:10px;color:var(--dim);margin-left: 38px}
  .context-box{margin:14px 16px;padding:11px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:9px}
  .context-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
  .context-val{font-size:12px;color:var(--white);font-weight:600;line-height:1.4}
  .steps{padding:6px 10px;flex:1}
  .step{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:background .15s}
  .step:hover{background:var(--surface2)}
  .step.active{background:var(--indigo-dim)}
  .step-num{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--fm);flex-shrink:0;border:1.5px solid var(--border-light);color:var(--dim)}
  .step.done .step-num{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .step.active .step-num{border-color:var(--indigo);color:var(--indigo)}
  .step-label{font-size:12px;color:var(--muted);font-weight:500;line-height:1.3}
  .step.active .step-label,.step.done .step-label{color:var(--white)}
  .step.locked{opacity:.32;pointer-events:none}
  .cam-mini{margin:8px 16px 18px;padding:13px;background:var(--surface2);border:1px solid var(--border);border-radius:9px}
  .cam-mini-title{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;display:flex;justify-content:space-between}
  .cam-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:11px;color:var(--muted)}
  .cam-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
  .cam-dot.on{background:var(--emerald)}
  .cam-row.on{color:var(--white)}

  /* Main */
  .main{margin-left:272px;flex:1;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(6,6,11,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:15px 38px;display:flex;align-items:center;justify-content:space-between}
  .topbar-title{font-family:var(--fd);font-weight:700;font-size:16px}
  .topbar-badge{font-family:var(--fm);font-size:10.5px;color:var(--indigo);background:var(--indigo-dim);padding:4px 11px;border-radius:100px;border:1px solid rgba(99,102,241,.25)}
  .content{padding:38px;max-width:1080px}
  h1.screen-title{font-family:var(--fd);font-size:28px;font-weight:700;margin-bottom:7px;letter-spacing:-.02em}
  .screen-sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;line-height:1.6;max-width:680px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:24px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .kv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .kv-row:last-child{border-bottom:none}
  .kv-key{color:var(--dim)}
  .kv-val{font-family:var(--fm);color:var(--white);font-weight:500}
  .kv-val.bad{color:var(--red)}.kv-val.good{color:var(--emerald)}.kv-val.warn{color:var(--amber)}
  .btn{font-family:var(--fd);font-weight:600;font-size:14px;padding:12px 24px;border-radius:9px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--indigo);color:#fff}
  .btn-primary:hover{background:#7577f5;transform:translateY(-1px)}
  .btn-primary:disabled{background:var(--surface3);color:var(--dim);cursor:not-allowed;transform:none}
  .btn-ghost{background:transparent;border:1px solid var(--border-light);color:var(--white)}
  .btn-ghost:hover{border-color:var(--indigo)}
  .btn-red{background:var(--red-dim);border:1px solid rgba(248,113,113,.3);color:var(--red)}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  .spinner.dark{border:2px solid rgba(4,20,13,.3);border-top-color:#04140d}
  .callout{padding:13px 16px;border-radius:9px;border-left:3px solid var(--indigo);background:var(--indigo-dim);font-size:13px;color:var(--white);line-height:1.6;margin:16px 0}
  .callout.red{border-left-color:var(--red);background:var(--red-dim)}
  .callout.emerald{border-left-color:var(--emerald);background:var(--emerald-dim)}
  .callout.amber{border-left-color:var(--amber);background:var(--amber-dim)}
  .callout strong{color:var(--indigo)}
  .callout.red strong{color:var(--red)}.callout.emerald strong{color:var(--emerald)}.callout.amber strong{color:var(--amber)}
  .banner-done{display:flex;align-items:center;gap:9px;padding:15px 18px;background:var(--emerald-dim);border:1px solid rgba(52,211,153,.3);border-radius:11px;margin-top:22px;font-size:13.5px;font-weight:600;color:var(--emerald)}
  .progress-track{height:7px;background:var(--surface3);border-radius:100px;overflow:hidden;margin:12px 0}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--cyan));border-radius:100px;width:0%;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}

  /* Camera feed canvas */
  .cam-container{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
  .cam-canvas{width:100%;height:100%;display:block}
  .cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;pointer-events:none}
  .cam-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-family:var(--fm);font-size:11px;font-weight:700;backdrop-filter:blur(8px)}
  .cam-badge.enc{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.4);color:var(--emerald);animation:encBlink 2s infinite}
  .cam-badge.vuln{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4);color:var(--red)}
  .cam-badge.plain{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4);color:var(--amber)}
  .cam-label{font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:4px;align-self:flex-start}
  .cam-metrics{display:flex;gap:8px}
  .cam-metric{background:rgba(0,0,0,.65);padding:4px 9px;border-radius:5px;font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.7)}
  .pulsedot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1s infinite}
  .pulsedot.green{background:var(--emerald)}

  /* Network capture */
  .net-vis{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:18px;margin:16px 0}
  .net-label{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:11px;font-family:var(--fm);display:flex;align-items:center;gap:8px}
  .net-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-family:var(--fm);font-size:11.5px}
  .net-hex{background:var(--surface3);border-radius:5px;padding:7px 11px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .net-hex.plain{color:var(--amber)}.net-hex.cipher{color:var(--emerald)}
  .net-tag{font-size:10px;padding:3px 8px;border-radius:100px;white-space:nowrap}
  .net-tag.plain{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,.2)}
  .net-tag.cipher{background:var(--emerald-dim);color:var(--emerald);border:1px solid rgba(52,211,153,.2)}
  .net-tag.vuln{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.2)}

  /* Metric cards */
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
  .metric-box{text-align:center;padding:16px 10px;background:var(--surface2);border-radius:9px;border:1px solid var(--border)}
  .metric-num{font-family:var(--fm);font-size:20px;font-weight:700}
  .metric-label{font-size:10.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}

  /* ONVIF scan */
  .cam-card{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(8px);transition:all .4s}
  .cam-card.visible{opacity:1;transform:translateY(0)}
  .cam-icon{width:40px;height:40px;border-radius:9px;background:var(--surface3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .cam-info{flex:1}
  .cam-name{font-size:13.5px;font-weight:600;margin-bottom:2px}
  .cam-ip{font-family:var(--fm);font-size:11px;color:var(--dim)}
  .cam-status{font-family:var(--fm);font-size:10.5px;padding:4px 10px;border-radius:100px}
  .cam-status.found{background:var(--emerald-dim);color:var(--emerald);border:1px solid rgba(52,211,153,.2)}
  .cam-status.enc{background:var(--indigo-dim);color:var(--indigo);border:1px solid rgba(99,102,241,.2)}

  /* Evidence rows */
  .ev-row{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--surface2);border-radius:8px;margin-bottom:7px;border:1px solid var(--border)}
  .ev-icon{font-size:15px;width:26px;text-align:center}
  .ev-label{flex:1;font-size:13px}
  .ev-val{font-family:var(--fm);font-size:11px;color:var(--emerald)}

  /* Timeline */
  .tl-item{display:flex;gap:14px;margin-bottom:0}
  .tl-line{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0}
  .tl-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--border-light);background:var(--surface3);flex-shrink:0;margin-top:4px}
  .tl-dot.red{border-color:var(--red);background:var(--red)}.tl-dot.amber{border-color:var(--amber);background:var(--amber)}.tl-dot.emerald{border-color:var(--emerald);background:var(--emerald)}.tl-dot.indigo{border-color:var(--indigo);background:var(--indigo)}
  .tl-connector{width:2px;flex:1;background:var(--border);min-height:18px}
  .tl-body{padding-bottom:22px;flex:1}
  .tl-year{font-family:var(--fm);font-size:10.5px;color:var(--dim);margin-bottom:2px}
  .tl-title{font-size:13.5px;font-weight:600;margin-bottom:3px}
  .tl-desc{font-size:12.5px;color:var(--muted);line-height:1.5}

  /* ─── Hamburger button ─────────────────────────────────────────────────── */
  .hamburger{display:none;background:none;border:none;color:var(--white);font-size:20px;cursor:pointer;padding:4px 8px;margin-right:12px;line-height:1;flex-shrink:0}

  /* ─── Sidebar overlay (mobile) ─────────────────────────────────────────── */
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:49}
  .sidebar-overlay.active{display:block}

  /* ─── Tablet & mobile: sidebar off-canvas, hamburger visible ──────────── */
  @media (max-width:1024px){
    .hamburger{display:block}
    .sidebar{transform:translateX(-100%);transition:transform .25s ease;z-index:50;width:280px}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0 !important}
    .topbar{padding:12px 16px}
    .content{padding:20px 16px}
    h1.screen-title{font-size:22px}
    .screen-sub{font-size:13px}
  }

  /* ─── Mobile: grid collapses, text tightens ────────────────────────────── */
  @media (max-width:768px){
    .grid-2{grid-template-columns:1fr !important}
    .metric-grid{grid-template-columns:1fr 1fr !important}
    .net-row{flex-wrap:wrap;gap:6px}
    .net-hex{min-width:0;font-size:10px}
    .content{padding:16px 14px}
    h1.screen-title{font-size:20px}
    .card{padding:16px}
    .btn{font-size:13px;padding:10px 18px}
    .cam-badge{font-size:9px;padding:3px 7px}
    table{font-size:11px}
    .kv-row{font-size:12px;flex-wrap:wrap;gap:4px}
    .kv-val{font-size:11px}
    .tl-desc{font-size:11.5px}
    .cam-container{max-width:100% !important}
  }
</style>
</head>

// ─── Sidebar toggle (mobile/tablet) ──────────────────────────────────────────
function toggleSidebar(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

// ─── State ────────────────────────────────────────────────────────────────────
const STEP_LABELS = [
  'Axxon One — The Gap',
  'Live: Unencrypted Stream',
  'Network Capture — Before',
  'ONVIF Discovery & Registration',
  'Live: PQC-Encrypted Stream',
  'Network Capture — After',
  'Compliance Evidence',
  'Partnership Model',
];
const CAMERAS = [
  {name:'Lobby Camera 01', ip:'192.168.1.101', model:'Axis P3245-V', location:'Headquarters'},
  {name:'Parking Garage A', ip:'192.168.1.102', model:'Hikvision DS-2CD2143G2', location:'Level B1'},
  {name:'Server Room Entry', ip:'192.168.1.103', model:'Dahua IPC-HDW2831T', location:'IT Wing'},
];
let state = {
  screen:1, maxUnlocked:1,
  camsProtected:[false,false,false],
  captureDone:false, discoveryDone:false,
  encStreamShown:false, evidenceDone:false,
};
function goTo(n){if(n>state.maxUnlocked)return;state.screen=n;closeSidebar();render();}
function unlockNext(){state.maxUnlocked=Math.max(state.maxUnlocked,state.screen+1);}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar(){
  document.getElementById('steps').innerHTML=STEP_LABELS.map((label,i)=>{
    const n=i+1,cls=['step'];
    if(n===state.screen)cls.push('active');
    else if(n<state.screen)cls.push('done');
    if(n>state.maxUnlocked)cls.push('locked');
    return `<div class="${cls.join(' ')}" onclick="goTo(${n})">
      <div class="step-num">${n<state.screen?'✓':n}</div>
      <div class="step-label">${label}</div></div>`;
  }).join('');
  const count=state.camsProtected.filter(Boolean).length;
  document.getElementById('miniCount').textContent=`${count} / 3 protected`;
  document.getElementById('miniList').innerHTML=CAMERAS.map((c,i)=>{
    const on=state.camsProtected[i];
    return `<div class="cam-row ${on?'on':''}"><div class="cam-dot ${on?'on':''}"></div>${c.name}</div>`;
  }).join('');
}

// ─── Canvas Camera Feed ───────────────────────────────────────────────────────
let animFrames={};
function stopAnim(id){if(animFrames[id]){cancelAnimationFrame(animFrames[id]);delete animFrames[id];}}

function drawCameraFeed(canvasId, encrypted=false, t=0){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.offsetWidth||640;
  const H=canvas.height=canvas.offsetHeight||360;
  ctx.clearRect(0,0,W,H);

  // Sky gradient background
  const sky=ctx.createLinearGradient(0,0,0,H*0.55);
  sky.addColorStop(0,'#0a0e1a');sky.addColorStop(1,'#1a2240');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.55);

  // Ground
  const gnd=ctx.createLinearGradient(0,H*0.55,0,H);
  gnd.addColorStop(0,'#0f1a0f');gnd.addColorStop(1,'#050d05');
  ctx.fillStyle=gnd;ctx.fillRect(0,H*0.55,W,H*0.45);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.6)';
  for(let i=0;i<40;i++){
    const sx=((i*137.5+t*0.01)%W),sy=((i*97+t*0.005)%(H*0.45));
    const op=0.3+0.5*Math.sin(t*0.05+i);
    ctx.globalAlpha=op;ctx.fillRect(sx,sy,1,1);
  }
  ctx.globalAlpha=1;

  // Buildings
  const buildings=[{x:.05,w:.08,h:.35,c:'#0d1530'},{x:.15,w:.06,h:.25,c:'#0f1835'},{x:.22,w:.10,h:.42,c:'#080f25'},{x:.33,w:.07,h:.30,c:'#0d1530'},{x:.42,w:.09,h:.38,c:'#0a1228'},{x:.53,w:.06,h:.22,c:'#0f1835'},{x:.61,w:.11,h:.44,c:'#080f25'},{x:.74,w:.08,h:.33,c:'#0d1530'},{x:.84,w:.07,h:.28,c:'#0a1228'},{x:.93,w:.09,h:.36,c:'#0f1835'}];
  buildings.forEach(b=>{
    const bx=b.x*W,bw=b.w*W,bh=b.h*H,by=H*0.55-bh;
    ctx.fillStyle=b.c;ctx.fillRect(bx,by,bw,bh);
    // Windows
    const cols=Math.floor(bw/12),rows=Math.floor(bh/16);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const wlit=Math.sin(t*0.02+r*7+c*13+b.x*100)>0.1;
      ctx.fillStyle=wlit?'rgba(255,240,180,0.7)':'rgba(20,30,60,0.8)';
      ctx.fillRect(bx+c*12+3,by+r*16+4,7,9);
    }
  });

  // Road
  ctx.fillStyle='#111418';ctx.fillRect(0,H*0.68,W,H*0.12);
  ctx.strokeStyle='rgba(255,220,50,0.4)';ctx.lineWidth=2;ctx.setLineDash([20,15]);
  ctx.beginPath();ctx.moveTo(0,H*0.74);ctx.lineTo(W,H*0.74);ctx.stroke();ctx.setLineDash([]);

  // Moving cars
  for(let i=0;i<3;i++){
    const cx=((t*0.6+i*220)%W);const cy=H*0.705;
    ctx.fillStyle='#1a1a2e';ctx.fillRect(cx,cy,40,14);
    ctx.fillStyle='rgba(255,180,50,0.8)';ctx.fillRect(cx+36,cy+4,4,6); // headlight
    ctx.fillStyle='rgba(255,50,50,0.7)';ctx.fillRect(cx,cy+4,4,6); // taillight
  }
  for(let i=0;i<2;i++){
    const cx=W-((t*0.4+i*300)%W);const cy=H*0.725;
    ctx.fillStyle='#1a1a2e';ctx.fillRect(cx-40,cy,40,14);
    ctx.fillStyle='rgba(255,180,50,0.8)';ctx.fillRect(cx-40,cy+4,4,6);
    ctx.fillStyle='rgba(255,50,50,0.7)';ctx.fillRect(cx-4,cy+4,4,6);
  }

  // Camera timestamp
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(W-168,6,162,22);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font=`10px 'JetBrains Mono',monospace`;
  const now=new Date();
  ctx.fillText(`CAM-01 ${now.toTimeString().slice(0,8)}`,W-162,21);

  // Motion detector box (optional)
  if(Math.sin(t*0.03)>0.7){
    const bx=W*0.3,by=H*0.6,bw=90,bh=60;
    ctx.strokeStyle='rgba(251,191,36,0.8)';ctx.lineWidth=1.5;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='rgba(251,191,36,0.8)';ctx.font=`9px 'JetBrains Mono',monospace`;
    ctx.fillText('MOTION',bx+4,by-3);
  }

  // Encryption noise overlay (when encrypted)
  if(encrypted){
    ctx.globalAlpha=0.04+0.02*Math.sin(t*0.1);
    for(let i=0;i<60;i++){
      const nx=(Math.random()*W)|0,ny=(Math.random()*H)|0;
      const nv=(Math.random()*255)|0;
      ctx.fillStyle=`rgb(${nv},${nv},${nv})`;
      ctx.fillRect(nx,ny,1,1);
    }
    ctx.globalAlpha=1;
    // Scan line
    const scanY=(t*2)%H;
    const scanGrad=ctx.createLinearGradient(0,scanY-3,0,scanY+3);
    scanGrad.addColorStop(0,'rgba(52,211,153,0)');
    scanGrad.addColorStop(0.5,'rgba(52,211,153,0.15)');
    scanGrad.addColorStop(1,'rgba(52,211,153,0)');
    ctx.fillStyle=scanGrad;ctx.fillRect(0,scanY-3,W,6);
  }

  animFrames[canvasId]=requestAnimationFrame(()=>drawCameraFeed(canvasId,encrypted,t+1));
}
