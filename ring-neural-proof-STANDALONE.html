<style>
  :root {
    --cyan:#22d3ee; --purple:#a78bfa; --amber:#eab308; --green:#34d399;
    --blue:#3b82f6; --red:#ef4444; --orange:#fb923c; --pink:#f472b6;
    --text:#e0e0f0; --sub:#a0a0b8; --muted:#8c8cae;
    --redText:#f87171; --amberText:#fbbf24;
    --card:#0d0d1a; --deep:#08080f; --border:#2a2a4a; --page:#0a0a14;
    --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--page); }
  body {
    font-family:var(--sans); color:var(--text); -webkit-font-smoothing:antialiased;
    background:radial-gradient(940px 620px at 50% 8%,#101a2e 0%,#0a0a14 62%),#0a0a14;
    min-height:100vh;
  }
  button { font-family:inherit; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }

  @keyframes rnSpin { to { transform:rotate(360deg) } }
  @keyframes rnUp { from { opacity:0; transform:translateY(9px) } to { opacity:1; transform:translateY(0) } }
  @keyframes rnFade { from { opacity:0 } to { opacity:1 } }
  @keyframes rnBreathe { 0%,100% { opacity:.16; r:104 } 50% { opacity:.04; r:118 } }
  @keyframes rnSweep { to { stroke-dashoffset:-720 } }
  @keyframes rnPop { 0% { opacity:0; transform:scale(.86) } 60% { transform:scale(1.04) } 100% { opacity:1; transform:scale(1) } }
  .spin { display:inline-flex; animation:rnSpin .8s linear infinite; }
  .up { animation:rnUp .3s ease both; }
  .fade { animation:rnFade .3s ease both; }
  .breathe { animation:rnBreathe 2.2s ease-in-out infinite; }
  .sweep { animation:rnSweep 2.6s linear infinite; }
  .pop { animation:rnPop .32s cubic-bezier(.3,1.3,.5,1) both; }

  .wrap { max-width:1180px; margin:0 auto; padding:30px clamp(14px,3vw,24px) 72px; }
  .card { border:1px solid var(--border); border-radius:18px; background:var(--card); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(316px,1fr)); gap:14px; }
  .stat { padding:9px 11px; border-radius:9px; background:var(--deep); border:1px solid var(--border); }
  .stat b { display:block; font:600 7.5px var(--mono); letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .stat s { display:block; text-decoration:none; font:700 14px var(--mono); margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; height:100%; min-height:230px; text-align:center; }
  .empty h4 { margin:0; font:600 11px var(--sans); color:var(--muted); }
  .empty p { margin:0; font:400 9.5px/1.55 var(--sans); color:var(--muted); max-width:250px; text-wrap:pretty; }
  .scen { padding:13px 14px; border-radius:13px; cursor:pointer; transition:all .2s; background:var(--card); border:1px solid var(--border); }
  .scen[data-on="1"] { background:rgba(34,211,238,.06); border-color:rgba(34,211,238,.45); }
  .tab { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 6px; cursor:pointer; white-space:nowrap; font:600 10.5px var(--sans); transition:all .2s; background:#0b0b15; color:var(--muted); }
  .tab[data-on="1"] { background:var(--card); color:var(--text); }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>

          <circle cx="170" cy="170" r="74" fill="#0b0b16" stroke="rgba(255,255,255,.07)" stroke-width="1"></circle>
        </svg>
        <div id="ringOverlay" style="position:absolute;inset:0;pointer-events:none"></div>
      </div>
      <button id="runBtn" style="height:42px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:11px;white-space:nowrap;font:700 12.5px var(--sans);border:none;cursor:pointer;background:var(--cyan);color:#04222a"></button>
      <div id="runStatus" style="font:400 9.5px/1.5 var(--mono);color:var(--muted);margin-top:9px;text-align:center;text-wrap:pretty"></div>
    </section>

    <section class="card" style="overflow:hidden;display:flex;flex-direction:column">
      <div id="tabs" style="display:flex;gap:1px;background:var(--border);flex-shrink:0"></div>
      <div id="panel" style="flex:1;padding:16px 17px;min-height:266px"></div>
    </section>
  </div>

  <div id="evidence"></div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var C = {
    cyan:'#22d3ee', purple:'#a78bfa', amber:'#eab308', green:'#34d399',
    blue:'#3b82f6', red:'#ef4444', orange:'#fb923c', pink:'#f472b6',
    text:'#e0e0f0', sub:'#a0a0b8', muted:'#8c8cae',
    redText:'#f87171', amberText:'#fbbf24',
    card:'#0d0d1a', deep:'#08080f', border:'#2a2a4a'
  };
  var SANS = "'Inter',sans-serif", MONO = "'JetBrains Mono',monospace";

  var ICON = {
    fleet:'M5 17h14M6 17v-4l2-5h8l2 5v4M7.5 17v2M16.5 17v2M8 13h8',
    pharma:'M10.5 3.5a5 5 0 017 7l-7 7a5 5 0 01-7-7zM7 7l10 10',
    finance:'M3 21h18M5 21V10M9 21V10M15 21V10M19 21V10M3 10l9-7 9 7',
    factory:'M3 21h18M4 21V10l5 3V10l5 3V7l5 3v11M8 17h.01M13 17h.01M18 17h.01',
    supply:'M21 16V8l-9-5-9 5v8l9 5 9-5zM3.3 7.3L12 12l8.7-4.7M12 22V12',
    custom:'M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5M12 9a3 3 0 100 6 3 3 0 000-6z',
    deny:'M12 3a9 9 0 100 18 9 9 0 000-18zM6 6l12 12',
    challenge:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z',
    allow:'M12 3a9 9 0 100 18 9 9 0 000-18zM8 12l3 3 5-6',
    block:'M18 6L6 18M6 6l12 12',
    alert:'M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0',
    lock:'M19 11H5v10h14V11zM8 11V7a4 4 0 018 0v4',
    log:'M6 2h9l5 5v15H6zM14 2v6h6',
    eye:'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7zM12 9a3 3 0 100 6 3 3 0 000-6z',
    check:'M20 6L9 17l-5-5',
    wave:'M3 12h4l3 8 4-16 3 8h4',
    bolt:'M13 2L3 14h7l-1 8 10-12h-7l1-8z',
    shield:'M12 3l8 4v6c0 4.2-3.4 7-8 8-4.6-1-8-3.8-8-8V7l8-4z',
    verify:'M12 3l8 4v6c0 4.2-3.4 7-8 8-4.6-1-8-3.8-8-8V7l8-4zM9 12l2 2 4-4',
    down:'M12 5v10M18 12l-6 6-6-6M5 21h14',
    loop:'M21 12a9 9 0 11-6.2-8.6'
  };

  /* Nine signal bands. Ranges are inclusive and tile 0-255 exactly. */
  var BANDS = [
    { name:'Security',      lo:0,   hi:17,  color:C.red },
    { name:'Compliance',    lo:18,  hi:27,  color:C.green },
    { name:'Geo-risk',      lo:28,  hi:40,  color:C.amber },
    { name:'Threat intel',  lo:41,  hi:55,  color:C.orange },
    { name:'TPRM',          lo:56,  hi:70,  color:C.purple },
    { name:'Supply chain',  lo:71,  hi:90,  color:C.cyan },
    { name:'Physical / IoT',lo:91,  hi:120, color:C.pink },
    { name:'Behavioural',   lo:121, hi:150, color:C.blue },
    { name:'Reserved',      lo:151, hi:255, color:C.muted }
  ];

  /* Each scenario declares which bands it lights and how hard, so the heatmap
     reads as a signature of the scenario rather than uniform noise.
     `nominal` exists so ALLOW is reachable - a decision engine that can only
     deny is not demonstrating judgement. */
  var SCENARIOS = [
    { key:'fleet', name:'Autonomous fleet', icon:ICON.fleet, risk:.82, domain:'physical_ai',
      desc:'GPS spoofing across 12 vehicles in convoy. Geofence breach plus firmware mismatch.',
      weights:{ 'Physical / IoT':.88, 'Geo-risk':.72, 'Behavioural':.44, 'Security':.38 },
      actions:[['Convoy halted at safe stop','fleet-control',ICON.block],['Firmware rollback staged','ota-service',ICON.lock],['SOC incident opened','soc-bridge',ICON.alert]] },
    { key:'pharma', name:'Pharma cold chain', icon:ICON.pharma, risk:.71, domain:'supply_chain',
      desc:'Temperature excursion in a vaccine shipment. 3\u00b0C over threshold for 47 minutes.',
      weights:{ 'Supply chain':.84, 'Compliance':.62, 'Geo-risk':.4, 'TPRM':.36 },
      actions:[['Batch quarantined on arrival','wms',ICON.block],['Stability review triggered','qms',ICON.log],['Consignee notified','edi',ICON.alert]] },
    { key:'finance', name:'Insider lateral move', icon:ICON.finance, risk:.91, domain:'cyber',
      desc:'Privileged account touching 14 systems in 90 seconds. Out of hours, VPN from a sanctioned region.',
      weights:{ 'Security':.93, 'Behavioural':.86, 'Threat intel':.58, 'Geo-risk':.66 },
      actions:[['Session terminated','iam',ICON.block],['Credentials revoked','vault',ICON.lock],['Forensic capture started','edr',ICON.log]] },
    { key:'factory', name:'Factory OT anomaly', icon:ICON.factory, risk:.78, domain:'iot_ot',
      desc:'PLC firmware mismatch, with an unexpected write to safety controller registers.',
      weights:{ 'Physical / IoT':.9, 'Security':.55, 'Compliance':.44, 'Threat intel':.34 },
      actions:[['Write blocked at the gateway','ot-proxy',ICON.block],['Line placed in safe state','scada',ICON.lock],['Engineering paged','oncall',ICON.alert]] },
    { key:'supply', name:'Supplier sanction hit', icon:ICON.supply, risk:.67, domain:'tprm',
      desc:'Tier-3 supplier flagged on the OFAC SDN list, with an active PO for a critical component.',
      weights:{ 'TPRM':.86, 'Geo-risk':.7, 'Compliance':.6, 'Supply chain':.5 },
      actions:[['PO placed on hold','erp',ICON.block],['Legal review requested','grc',ICON.log],['Alternate source surfaced','sourcing',ICON.eye]] },
    { key:'nominal', name:'Nominal baseline', icon:ICON.custom, risk:.18, domain:'baseline',
      desc:'Routine access during business hours from a managed device. Included so ALLOW is reachable.',
      weights:{ 'Compliance':.42, 'Behavioural':.2, 'Security':.14 },
      actions:[['Access granted','iam',ICON.check],['Decision logged','audit',ICON.log],['Baseline monitoring','telemetry',ICON.eye]] }
  ];

  var PHASES = [
    { key:'observe', label:'Observe', sub:'256-dim',     color:C.cyan },
    { key:'orient',  label:'Orient',  sub:'ring-native', color:C.purple },
    { key:'decide',  label:'Decide',  sub:'verdict',     color:C.amber },
    { key:'act',     label:'Act',     sub:'enforce',     color:C.green }
  ];

  var DENY_T = 0.66, CHALLENGE_T = 0.42, LOCAL_US = 11000, CLOUD_US = 340000;
  var CX = 170, CY = 170, R = 112;
  var PHASE_MS = 520, VERIFY_MS = 700, HISTORY_LIMIT = 8;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); }
  function ico(d, size, color, w) {
    return '<svg width="' + (size||14) + '" height="' + (size||14) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color||'currentColor') +
      '" stroke-width="' + (w||1.85) + '" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="' + d + '"/></svg>';
  }
  function badge(t, c) {
    return '<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;font:600 8.5px ' + MONO +
      ';letter-spacing:.06em;text-transform:uppercase;color:' + c + ';background:' + c + '1A;border:1px solid ' + c + '4D">' + esc(t) + '</span>';
  }
  /* badge() lays down a tint that lifts the surface; BARE small text gets no
     such help, and #ef4444 measures only 4.11:1 on #0d0d1a. */
  function textSafe(c) { return c === C.red ? C.redText : c === C.amber ? C.amberText : c; }
  function bandOf(i) { for (var k = 0; k < BANDS.length; k++) if (i >= BANDS[k].lo && i <= BANDS[k].hi) return BANDS[k]; return BANDS[BANDS.length-1]; }
  function randomHex(bytes) { var s = ''; for (var i = 0; i < bytes; i++) s += Math.floor(Math.random()*256).toString(16).padStart(2,'0'); return s; }
  function logPos(us) { return Math.max(4, Math.min(100, (Math.log(us)/Math.LN10 - 1) / 4 * 100)); }
  function arcPath(i) {
    var a1 = (i*90 - 86) * Math.PI/180, a2 = (i*90 - 4) * Math.PI/180;
    return 'M' + (CX + R*Math.cos(a1)).toFixed(2) + ' ' + (CY + R*Math.sin(a1)).toFixed(2) +
      ' A' + R + ' ' + R + ' 0 0 1 ' + (CX + R*Math.cos(a2)).toFixed(2) + ' ' + (CY + R*Math.sin(a2)).toFixed(2);
  }
  function labelPos(i) {
    var a = (i*90 - 45) * Math.PI/180;
    return { x:(CX + 148*Math.cos(a))/340*100, y:(CY + 148*Math.sin(a))/340*100 };
  }
  function statBox(k, v, color) {
    return '<div class="stat"><b>' + esc(k) + '</b><s style="color:' + (color||C.text) + '">' + esc(v) + '</s></div>';
  }
  function emptyState(icon, title, body) {
    return '<div class="empty">' + ico(icon, 19, C.muted, 1.7) + '<h4>' + esc(title) + '</h4><p>' + esc(body) + '</p></div>';
  }

  /* ---------- state ---------- */
  var S = {
    scenario:'finance', tab:'observe', phase:-1, running:false,
    result:null, verifying:false, verified:false, history:[], cycle:0, tick:0
  };
  var timer, ticker, toaster;

  function scen() {
    for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].key === S.scenario) return SCENARIOS[i];
    return SCENARIOS[0];
  }
  function flash(msg, color) {
    var el = document.getElementById('toast');
    el.innerHTML = '<div class="up" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:11px;background:#1e1e3a;border:1px solid ' + C.border +
      ';box-shadow:0 22px 60px rgba(0,0,0,.6);max-width:92vw"><span style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:' + (color||C.green) +
      '"></span><span style="font:500 11.5px ' + SANS + ';color:' + C.text + '">' + esc(msg) + '</span></div>';
    clearTimeout(toaster);
    toaster = setTimeout(function () { el.innerHTML = ''; }, 2800);
  }

  /* ---------- engine ---------- */
  function observe(s) {
    var v = new Array(256);
    for (var i = 0; i < 256; i++) {
      var base = s.weights[bandOf(i).name] || 0;
      var noise = (Math.random() - .45) * .3;
      v[i] = Math.max(0, Math.min(1, base ? base + noise : Math.random() * .22));
    }
    return v;
  }
  function infer(s, obs, cycle) {
    var action = [], i, j;
    for (i = 0; i < 8; i++) {
      var sum = 0;
      for (j = i*32; j < (i+1)*32; j++) sum += obs[j];
      /* signed, so the vector reads as direction and not only magnitude */
      action.push(Math.tanh((sum/32) * 2.4 - (i % 3 === 1 ? 1.1 : .55)));
    }
    var mag = action.reduce(function (a, v) { return a + Math.abs(v); }, 0) / action.length;
    var score = mag * .55 + s.risk * .45;
    var verdict, color, icon, conf, reason;
    if (score > DENY_T) {
      verdict = 'DENY'; color = C.red; icon = ICON.deny; conf = .88 + Math.random()*.08;
      reason = 'Composite risk ' + score.toFixed(3) + ' is above the deny threshold of ' + DENY_T.toFixed(3) + '. The ' + s.domain +
        ' band dominates the observation, and the action vector points consistently negative across four of eight dimensions.';
    } else if (score > CHALLENGE_T) {
      verdict = 'CHALLENGE'; color = C.amber; icon = ICON.challenge; conf = .71 + Math.random()*.1;
      reason = 'Composite risk ' + score.toFixed(3) + ' sits between thresholds. Not enough to deny outright, too much to pass silently \u2014 step-up authentication is required before the action proceeds.';
    } else {
      verdict = 'ALLOW'; color = C.green; icon = ICON.allow; conf = .85 + Math.random()*.1;
      reason = 'Composite risk ' + score.toFixed(3) + ' is below the challenge threshold of ' + CHALLENGE_T.toFixed(3) +
        '. Every band reads nominal and the action vector shows no sustained negative pressure.';
    }
    return { action:action, mag:mag, score:score, verdict:verdict, color:color, icon:icon, conf:conf, reason:reason,
      cycle:cycle, latency:34 + Math.floor(Math.random()*62), sig:randomHex(64), pk:randomHex(32),
      stateHash:randomHex(32), cipher:randomHex(24), ts:Math.floor(Date.now()/1000), obs:obs,
      scenario:s.name, actions:s.actions };
  }
  function bandStats(r) {
    return BANDS.map(function (b) {
      var sum = 0, n = 0;
      for (var i = b.lo; i <= b.hi; i++) { sum += r.obs[i]; n++; }
      return { name:b.name, color:b.color, avg:sum/n, range:'[' + b.lo + '\u2013' + b.hi + ']' };
    });
  }

  /* ---------- actions ---------- */
  function run() {
    if (S.running) return;
    clearTimeout(timer); clearInterval(ticker);
    S.running = true; S.phase = -1; S.result = null; S.verified = false; S.tab = 'observe'; S.tick = 0;
    render();
    /* the core counter ticks while the ring fills - the latency figure is the
       product's whole argument, so it holds the centre of the composition */
    ticker = setInterval(function () { S.tick++; renderRing(); }, 55);

    var s = scen(), obs = observe(s);
    function step(i) {
      if (i >= PHASES.length) {
        clearInterval(ticker);
        S.cycle++;
        var r = infer(s, obs, S.cycle);
        S.running = false; S.phase = PHASES.length; S.result = r; S.tab = 'decide';
        S.history.unshift({ cycle:r.cycle, scenario:r.scenario, verdict:r.verdict, color:r.color, latency:r.latency });
        S.history = S.history.slice(0, HISTORY_LIMIT);
        render();
        flash('Cycle #' + r.cycle + ' \u00b7 ' + r.verdict + ' in ' + r.latency + '\u00b5s', textSafe(r.color));
        return;
      }
      S.phase = i; S.tab = PHASES[i].key; render();
      timer = setTimeout(function () { step(i+1); }, PHASE_MS);
    }
    timer = setTimeout(function () { step(0); }, 200);
  }
  function verify() {
    if (S.verifying || S.verified || !S.result) return;
    S.verifying = true; render();
    clearTimeout(timer);
    timer = setTimeout(function () {
      S.verifying = false; S.verified = true; render();
      flash('ML-DSA-65 verification passed \u2014 no report data touched');
    }, VERIFY_MS);
  }
  function download() {
    var r = S.result; if (!r) return;
    var proof = {
      version:'1.0', engine:'ring-native-rust', algorithm:'ML-DSA-65',
      cycle:r.cycle, timestamp:r.ts, timestamp_iso:new Date(r.ts*1000).toISOString(),
      latency_us:r.latency, decision:r.verdict, confidence:r.conf, composite_risk:r.score,
      action_vector:r.action, signature_hex:r.sig, public_key_hex:r.pk, state_hash:r.stateHash,
      reason:r.reason, verifiable:true,
      note:'Verify with: ring_verify_decision(pk, action_vector, signature, timestamp, cycle)'
    };
    var blob = new Blob([JSON.stringify(proof, null, 2)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ooda-proof-cycle-' + r.cycle + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    flash('ooda-proof-cycle-' + r.cycle + '.json exported');
  }

  /* ---------- render ---------- */
  function renderBadges() {
    var list = [['Ring-native Rust',C.cyan],['ML-DSA-65 signed',C.green],['Post-quantum',C.amberText],['No external API',C.purple]];
    document.getElementById('badges').innerHTML = list.map(function (b) {
      return '<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;white-space:nowrap;font:600 9px ' + MONO +
        ';letter-spacing:.07em;text-transform:uppercase;color:' + b[1] + ';background:' + b[1] + '14;border:1px solid ' + b[1] +
        '3D"><span style="width:5px;height:5px;border-radius:50%;flex-shrink:0;background:' + b[1] + '"></span>' + b[0] + '</span>';
    }).join('');
  }

  function renderScenarios() {
    document.getElementById('scenarios').innerHTML = SCENARIOS.map(function (x) {
      var on = S.scenario === x.key;
      var col = x.risk > .8 ? C.redText : x.risk > .6 ? C.amberText : C.green;
      return '<div class="scen" data-scen="' + x.key + '" data-on="' + (on?1:0) + '">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<span style="width:27px;height:27px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:' +
            (on?C.cyan:C.muted) + ';background:' + (on?'rgba(34,211,238,.12)':'rgba(255,255,255,.035)') + '">' + ico(x.icon, 15) + '</span>' +
          '<span style="font:700 9.5px ' + MONO + ';color:' + col + '">' + x.risk.toFixed(2) + '</span>' +
        '</div>' +
        '<div style="font:600 11.5px ' + SANS + ';color:' + (on?C.text:C.sub) + ';margin-top:10px">' + esc(x.name) + '</div>' +
        '<div style="font:400 9.5px/1.45 ' + SANS + ';color:' + C.muted + ';margin-top:5px;text-wrap:pretty">' + esc(x.desc) + '</div>' +
        '<div style="height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px">' +
          '<div style="height:100%;border-radius:2px;width:' + (x.risk*100) + '%;background:' + col + '"></div></div>' +
      '</div>';
    }).join('');
  }

  function renderRing() {
    var r = S.result;
    document.getElementById('cycleTag').innerHTML =
      badge(r ? 'cycle #' + r.cycle : S.running ? 'running' : 'idle', r ? C.green : S.running ? C.cyan : C.muted);

    document.getElementById('arcs').innerHTML = PHASES.map(function (p, i) {
      var done = S.phase > i || (!!r && !S.running), active = S.running && S.phase === i;
      return '<path d="' + arcPath(i) + '" stroke="' + p.color + '" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:' +
        (done ? 0 : active ? 55 : 100) + ';opacity:' + (done ? 1 : active ? .95 : .16) +
        ';transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.25,1),opacity .35s' + (active ? ';filter:url(#glow)' : '') + '"/>';
    }).join('');

    document.getElementById('sweepWrap').innerHTML = S.running
      ? '<circle class="sweep" cx="170" cy="170" r="132" fill="none" stroke="rgba(34,211,238,.5)" stroke-width="1.5" stroke-dasharray="5 34"/>' : '';
    var pulse = document.getElementById('pulse');
    pulse.setAttribute('class', S.running ? 'breathe' : '');
    pulse.setAttribute('opacity', S.running ? '' : '.05');

    /* core: idle -> ready | running -> live counter | done -> verdict */
    var kicker, kickerColor, value, unit, note, size;
    if (S.running) {
      kicker = 'Inferring'; kickerColor = C.cyan; value = String(12 + S.tick*7); unit = '\u00b5s';
      note = PHASES[Math.max(0,S.phase)] ? PHASES[Math.max(0,S.phase)].label + ' phase' : 'starting'; size = 30;
    } else if (r) {
      kicker = 'Cycle #' + r.cycle; kickerColor = textSafe(r.color); value = String(r.latency); unit = '\u00b5s';
      note = r.verdict + ' \u00b7 signed'; size = 34;
    } else {
      kicker = 'Ring-Neural'; kickerColor = C.muted; value = '\u2014'; unit = '';
      note = 'No cycle has run'; size = 30;
    }

    var html = '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;text-align:center">' +
      '<div style="font:600 8px ' + MONO + ';letter-spacing:.16em;text-transform:uppercase;color:' + kickerColor + '">' + esc(kicker) + '</div>' +
      '<div style="font:700 ' + size + 'px/1 ' + MONO + ';letter-spacing:-.03em;color:' + ((r||S.running)?C.cyan:C.muted) + ';margin-top:7px">' + value +
        '<span style="font:600 12px ' + MONO + ';color:' + C.muted + ';margin-left:2px">' + unit + '</span></div>' +
      '<div style="font:400 9px/1.4 ' + SANS + ';color:' + C.muted + ';margin-top:5px;text-wrap:pretty">' + esc(note) + '</div></div>';

    html += PHASES.map(function (p, i) {
      var pos = labelPos(i), done = S.phase > i || (!!r && !S.running), active = S.running && S.phase === i;
      return '<div style="position:absolute;left:' + pos.x.toFixed(2) + '%;top:' + pos.y.toFixed(2) +
        '%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;opacity:' + (done||active?1:.5) + ';transition:opacity .3s">' +
        '<div style="font:700 9px ' + MONO + ';letter-spacing:.14em;text-transform:uppercase;color:' + ((done||active)?p.color:C.muted) + '">' + p.label + '</div>' +
        '<div style="font:400 8px ' + MONO + ';color:' + C.muted + ';margin-top:2px">' + p.sub + '</div></div>';
    }).join('');
    document.getElementById('ringOverlay').innerHTML = html;

    var btn = document.getElementById('runBtn');
    btn.disabled = S.running;
    btn.style.background = S.running ? 'rgba(34,211,238,.16)' : C.cyan;
    btn.style.color = S.running ? C.cyan : '#04222a';

      S.history.map(function (h) {
        return '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(42,42,74,.6);flex-wrap:wrap">' +
          '<span style="font:700 10px ' + MONO + ';color:' + C.cyan + ';width:38px;flex-shrink:0">#' + h.cycle + '</span>' +
          '<span style="flex:1;min-width:110px;font:400 10.5px ' + SANS + ';color:' + C.sub + ';overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(h.scenario) + '</span>' +
          badge(h.verdict, textSafe(h.color)) +
          '<div style="width:64px;height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;flex-shrink:0">' +
            '<div style="height:100%;border-radius:2px;width:' + Math.min(100, h.latency/96*100).toFixed(0) + '%;background:' + C.cyan + '"></div></div>' +
          '<span style="width:52px;text-align:right;font:600 9.5px ' + MONO + ';color:' + C.muted + ';flex-shrink:0">' + h.latency + '\u00b5s</span></div>';
      }).join('') + '</section>';

    el.innerHTML = heat + '<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px">' +
      proof + compare + '</div>' + history;
  }

  function render() { renderScenarios(); renderRing(); renderTabs(); renderPanel(); renderEvidence(); }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var sc = e.target.closest('[data-scen]');
    if (sc) {
      if (S.running) return;
      /* a new scenario invalidates the previous result - never leave a verdict
         on screen that was produced by different inputs */
      S.scenario = sc.getAttribute('data-scen');
      S.result = null; S.verified = false; S.phase = -1; S.tab = 'observe';
      render(); return;
    }
    var tb = e.target.closest('[data-tab]');
    if (tb) { S.tab = tb.getAttribute('data-tab'); renderTabs(); renderPanel(); return; }
    if (e.target.closest('#runBtn')) { run(); return; }
    if (e.target.closest('#verifyBtn')) { verify(); return; }
    if (e.target.closest('#dlBtn')) { download(); return; }
  });

  renderBadges();
  render();
})();
</script>
</body>
</html>
