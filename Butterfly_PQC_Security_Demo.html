<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — Quantum-Safe Imaging Security · Butterfly Network</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060B; --surface: #0E0E16; --surface2: #16161F; --surface3: #1C1C28;
    --border: #252535; --border-light: #2E2E40;
    --emerald: #34D399; --emerald-dim: rgba(52,211,153,0.12);
    --red: #F87171; --red-dim: rgba(248,113,113,0.12);
    --amber: #FBBF24; --amber-dim: rgba(251,191,36,0.12);
    --cyan: #22D3EE; --cyan-dim: rgba(34,211,238,0.12);
    --blue: #60A5FA; --blue-dim: rgba(96,165,250,0.12);
    --purple: #A78BFA; --purple-dim: rgba(167,139,250,0.12);
    --teal: #2DD4BF; --teal-dim: rgba(45,212,191,0.12);
    --white: #F0EDE6; --muted: #8E8EA3; --dim: #55556A;
    --fd: 'Space Grotesk', sans-serif; --fb: 'DM Sans', sans-serif; --fm: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--white); font-family: var(--fb); overflow-x: hidden; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes checkPop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes flow { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  .fade-in { animation: fadeIn 0.4s ease-out both; }
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .brand { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-mark { width: 26px; height: 26px; border: 2px solid var(--teal); border-radius: 7px; display:flex; align-items:center; justify-content:center; }
  .brand-mark div { width: 9px; height: 9px; background: var(--teal); border-radius: 2px; }
  .brand-name { font-family: var(--fd); font-weight: 700; font-size: 14.5px; color: var(--teal); letter-spacing: 0.03em; }
  .brand-sub { font-size: 10.5px; color: var(--dim); margin-left: 36px; }
  .context-box { margin: 16px 18px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .context-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .context-val { font-size: 12.5px; color: var(--white); font-weight: 600; line-height: 1.4; }
  .steps { padding: 8px 12px; flex: 1; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
  .step:hover { background: var(--surface2); }
  .step.active { background: var(--teal-dim); }
  .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; font-family: var(--fm); flex-shrink: 0; border: 1.5px solid var(--border-light); color: var(--dim); }
  .step.done .step-num { background: var(--teal); border-color: var(--teal); color: #04140d; }
  .step.active .step-num { border-color: var(--teal); color: var(--teal); }
  .step-label { font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .step.active .step-label, .step.done .step-label { color: var(--white); }
  .step.locked { opacity: 0.35; pointer-events: none; }
  .threat-mini { margin: 10px 18px 20px; padding: 14px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.25); border-radius: 10px; }
  .threat-mini-title { font-size: 9.5px; color: var(--red); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; font-weight: 700; }
  .threat-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--muted); }
  .threat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; animation: blink 2s infinite; }
  .threat-dot.off { animation: none; background: var(--dim); }
  .threat-row.resolved { color: var(--emerald); }
  .threat-row.resolved .threat-dot { background: var(--emerald); animation: none; }

  /* Main */
  .main { margin-left: 280px; flex: 1; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(6,6,11,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 40px; display:flex; align-items:center; justify-content: space-between; }
  .topbar-title { font-family: var(--fd); font-weight: 700; font-size: 17px; }
  .topbar-badge { font-family: var(--fm); font-size: 11px; color: var(--teal); background: var(--teal-dim); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(45,212,191,0.25); }
  .content { padding: 40px; max-width: 1100px; }

  h1.screen-title { font-family: var(--fd); font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .screen-sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; max-width: 700px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  .kv-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-key { color: var(--dim); }
  .kv-val { font-family: var(--fm); color: var(--white); font-weight: 500; }
  .kv-val.bad { color: var(--red); }
  .kv-val.good { color: var(--emerald); }
  .kv-val.warn { color: var(--amber); }

  .btn { font-family: var(--fd); font-weight: 600; font-size: 14.5px; padding: 13px 26px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--teal); color: #04140d; }
  .btn-primary:hover { background: #3de8d3; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--surface3); color: var(--dim); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--white); }
  .btn-ghost:hover { border-color: var(--teal); }
  .btn-red { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }

  .progress-track { height: 8px; background: var(--surface3); border-radius: 100px; overflow: hidden; margin: 14px 0; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--amber)); border-radius: 100px; width: 0%; transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .progress-fill.safe { background: linear-gradient(90deg, var(--cyan), var(--emerald)); }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(4,20,13,0.3); border-top-color: #04140d; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .callout { padding: 14px 18px; border-radius: 10px; border-left: 3px solid var(--teal); background: rgba(45,212,191,0.06); font-size: 13.5px; color: var(--white); line-height: 1.6; margin: 18px 0; }
  .callout.red { border-left-color: var(--red); background: var(--red-dim); }
  .callout.amber { border-left-color: var(--amber); background: var(--amber-dim); }
  .callout.blue { border-left-color: var(--blue); background: var(--blue-dim); }
  .callout strong { color: var(--teal); }
  .callout.red strong { color: var(--red); }
  .callout.amber strong { color: var(--amber); }
  .callout.blue strong { color: var(--blue); }
  .banner-done { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--teal-dim); border: 1px solid rgba(45,212,191,0.3); border-radius: 12px; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--teal); }
  .banner-alert { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.3); border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--red); }

  /* Threat timeline */
  .timeline { position: relative; }
  .tl-item { display: flex; gap: 16px; margin-bottom: 0; }
  .tl-line { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-light); background: var(--surface3); flex-shrink: 0; margin-top: 4px; }
  .tl-dot.red { border-color: var(--red); background: var(--red); }
  .tl-dot.amber { border-color: var(--amber); background: var(--amber); }
  .tl-dot.emerald { border-color: var(--emerald); background: var(--emerald); }
  .tl-dot.teal { border-color: var(--teal); background: var(--teal); }
  .tl-connector { width: 2px; flex: 1; background: var(--border); min-height: 20px; }
  .tl-body { padding-bottom: 24px; flex: 1; }
  .tl-year { font-family: var(--fm); font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .tl-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .tl-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* Packet visualiser */
  .packet-vis { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 18px 0; }
  .packet-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; font-family: var(--fm); }
  .packet-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: var(--fm); font-size: 12px; }
  .packet-hex { background: var(--surface3); border-radius: 6px; padding: 8px 12px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .packet-hex.plain { color: var(--amber); }
  .packet-hex.cipher { color: var(--emerald); }
  .packet-tag { font-size: 10px; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
  .packet-tag.plain { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(251,191,36,0.2); }
  .packet-tag.cipher { background: var(--emerald-dim); color: var(--emerald); border: 1px solid rgba(52,211,153,0.2); }

  /* Session card */
  .session-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .session-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .session-title { font-size: 13.5px; font-weight: 600; }
  .session-badge { font-family: var(--fm); font-size: 10.5px; padding: 4px 10px; border-radius: 100px; }
  .session-badge.vulnerable { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  .session-badge.protected { background: var(--emerald-dim); color: var(--emerald); border: 1px solid rgba(52,211,153,0.2); }
  .session-badge.harvested { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(251,191,36,0.2); }

  .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
  .metric-box { text-align: center; padding: 18px 12px; background: var(--surface2); border-radius: 10px; border: 1px solid var(--border); }
  .metric-num { font-family: var(--fm); font-size: 22px; font-weight: 700; }
  .metric-label { font-size: 11px; color: var(--dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* SDK integration view */
  .sdk-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 12px; }
  .sdk-block-title { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .sdk-block-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .code-block { background: var(--surface3); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-family: var(--fm); font-size: 12.5px; color: var(--cyan); line-height: 1.7; margin: 12px 0; overflow-x: auto; }
  .code-comment { color: var(--dim); }
  .code-fn { color: var(--teal); }
  .code-str { color: var(--amber); }
  .code-kw { color: var(--purple); }
  .code-type { color: var(--blue); }

  .evidence-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 9px; margin-bottom: 8px; border: 1px solid var(--border); }
  .evidence-icon { font-size: 16px; width: 28px; text-align: center; }
  .evidence-label { flex: 1; font-size: 13.5px; }
  .evidence-status { font-family: var(--fm); font-size: 11px; }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark"><div></div></div>
        <span class="brand-name">agenticvaults</span>
      </div>
      <div class="brand-sub">SENTINEL · Quantum Security</div>
    </div>
    <div class="context-box">
      <div class="context-label">Technology Partnership</div>
      <div class="context-val">Butterfly Network — iQ Probe Quantum-Safe Imaging</div>
    </div>

    <div class="steps" id="steps"></div>

    <div class="threat-mini">
      <div class="threat-mini-title">⚠ Active Threat Vectors</div>
      <div id="threatList"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topTitle">The Threat Landscape</div>
      <div class="topbar-badge" id="topBadge">iQ Probe · HIPAA §164.312</div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const STEP_LABELS = [
  'The Threat Landscape',
  'Harvest Now, Decrypt Later',
  'What the Network Sees Today',
  'The SENTINEL SDK Approach',
  'Session-Level PQC Encryption',
  'HIPAA Compliance Evidence',
  'Roadmap: From SDK to Platform',
];

const THREATS = [
  { label: 'RSA key exchange on imaging sessions' },
  { label: 'Patient data capturable on hospital LAN' },
  { label: 'Harvest-now-decrypt-later exposure' },
  { label: 'HIPAA §164.312 gap — no PQC mandate yet' },
];

let state = {
  screen: 1,
  maxUnlocked: 1,
  threatsResolved: [false, false, false, false],
  captureShown: false,
  sdkIntegrated: false,
  sessionProtected: false,
  evidenceGenerated: false,
};

function goTo(n) {
  if (n > state.maxUnlocked) return;
  state.screen = n;
  render();
}
function unlockNext() {
  state.maxUnlocked = Math.max(state.maxUnlocked, state.screen + 1);
}
function resolveThreats(indices) {
  indices.forEach(i => state.threatsResolved[i] = true);
  renderSidebar();
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    const cls = ['step'];
    if (n === state.screen) cls.push('active');
    else if (n < state.screen) cls.push('done');
    if (n > state.maxUnlocked) cls.push('locked');
    const numContent = (n < state.screen) ? '✓' : n;
    return `<div class="${cls.join(' ')}" onclick="goTo(${n})">
      <div class="step-num">${numContent}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');

  document.getElementById('threatList').innerHTML = THREATS.map((t, i) => {
    const resolved = state.threatsResolved[i];
    return `<div class="threat-row ${resolved ? 'resolved' : ''}">
      <div class="threat-dot ${resolved ? '' : ''}"></div>
      ${t.label}
    </div>`;
  }).join('');
}

// ─── Screens ──────────────────────────────────────────────────────────────────

function screen1() {
  return `
  <h1 class="screen-title">The Threat Landscape</h1>
  <p class="screen-sub">The Butterfly iQ probe transmits patient imaging data wirelessly. Every session that uses classical cryptography — RSA, ECDH — is exposed to a threat that didn't exist when HIPAA was written.</p>

  <div class="grid-2" style="margin-bottom: 24px;">
    <div class="card">
      <div style="font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; font-family: var(--fm);">Today's Threat Model</div>
      <div class="timeline">
        <div class="tl-item">
          <div class="tl-line"><div class="tl-dot red"></div><div class="tl-connector"></div></div>
          <div class="tl-body">
            <div class="tl-year">2026 · NOW</div>
            <div class="tl-title" style="color: var(--red);">Traffic being harvested</div>
            <div class="tl-desc">Nation-state actors and organised crime are capturing encrypted medical traffic at ISPs, hospital peering points, and cloud uplinks. They cannot read it yet.</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-line"><div class="tl-dot amber"></div><div class="tl-connector"></div></div>
          <div class="tl-body">
            <div class="tl-year">2030–2033 · NIST CNSA 2.0 DEADLINE</div>
            <div class="tl-title" style="color: var(--amber);">Government mandate arrives</div>
            <div class="tl-desc">US government systems required to use ML-KEM + ML-DSA. Healthcare suppliers to government (VA, DoD, CMS) face indirect mandate. Butterfly sells into all three.</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-line"><div class="tl-dot red"></div><div class="tl-connector"></div></div>
          <div class="tl-body">
            <div class="tl-year">2034–2036 · CRYPTOGRAPHICALLY RELEVANT QC</div>
            <div class="tl-title" style="color: var(--red);">RSA is broken</div>
            <div class="tl-desc">Harvest-now-decrypt-later attacks become viable. Every RSA-protected session captured between 2026 and 2033 becomes readable. Patient imaging data, clinical notes, PHI — all decrypted retroactively.</div>
          </div>
        </div>
        <div class="tl-item">
          <div class="tl-line"><div class="tl-dot emerald"></div></div>
          <div class="tl-body">
            <div class="tl-year">2026 · IF YOU ACT NOW</div>
            <div class="tl-title" style="color: var(--emerald);">Sessions captured today stay encrypted forever</div>
            <div class="tl-desc">ML-KEM-768 key exchange cannot be broken even by a future quantum computer. Traffic captured today remains protected in 2034. The window closes the moment you integrate.</div>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div class="card">
        <div style="font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; font-family: var(--fm);">Butterfly iQ Exposure Surface</div>
        <div class="kv-row"><span class="kv-key">Transport</span><span class="kv-val warn">WiFi + cellular + hospital LAN</span></div>
        <div class="kv-row"><span class="kv-key">Current key exchange</span><span class="kv-val bad">RSA / ECDH (quantum-vulnerable)</span></div>
        <div class="kv-row"><span class="kv-key">Session data</span><span class="kv-val bad">PHI, patient identity, imaging</span></div>
        <div class="kv-row"><span class="kv-key">HIPAA §164.312(e)</span><span class="kv-val warn">Compliant today — gap emerging</span></div>
        <div class="kv-row"><span class="kv-key">HNDL exposure window</span><span class="kv-val bad">Every session from 2026 forward</span></div>
      </div>
      <div class="callout red">
        <strong>The liability framing:</strong> A hospital CISO who knows about harvest-now-decrypt-later attacks and deploys Butterfly iQ anyway without quantum-safe encryption takes on personal liability under HIPAA §164.312's "reasonable and appropriate safeguards" standard. That standard is not static — it evolves with foreseeable threats.
      </div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="unlockNext(); goTo(2)">See the Attack in Detail →</button>`;
}

function screen2() {
  return `
  <h1 class="screen-title">Harvest Now, Decrypt Later</h1>
  <p class="screen-sub">The attack doesn't require breaking encryption today. An adversary captures encrypted sessions now and waits for quantum computers to decrypt them later. The damage is invisible until it's too late to fix.</p>

  <div class="card" style="margin-bottom: 20px;">
    <div style="font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 20px; font-family: var(--fm);">Attack Timeline — Single iQ Session</div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 24px;">
      <div style="background: var(--surface2); padding: 20px; text-align: center;">
        <div style="font-family: var(--fm); font-size: 28px; font-weight: 700; color: var(--red);">2026</div>
        <div style="font-size: 12.5px; font-weight: 600; margin: 8px 0 6px; color: var(--white);">Session Captured</div>
        <div style="font-size: 12px; color: var(--muted); line-height: 1.5;">Adversary passively captures 847 KB of encrypted iQ imaging session from hospital WiFi. HTTPS/TLS with RSA-2048 key exchange. Indistinguishable from any other traffic.</div>
      </div>
      <div style="background: var(--surface2); padding: 20px; text-align: center; border-left: 1px solid var(--border);">
        <div style="font-family: var(--fm); font-size: 28px; font-weight: 700; color: var(--amber);">2030</div>
        <div style="font-size: 12.5px; font-weight: 600; margin: 8px 0 6px; color: var(--white);">Archive Maintained</div>
        <div style="font-size: 12px; color: var(--muted); line-height: 1.5;">The 847 KB file sits on an air-gapped server. Storage is cheap. The adversary has been collecting iQ sessions from 12 hospital networks for 4 years. 200 GB archive. Waiting.</div>

      if (i === fields.length - 1) {
        document.getElementById('evidenceDone').style.display = 'block';
        btn.style.display = 'none';
        resolveThreats([0,1,2,3]);
      }
    }, i * 100);
  });
}
