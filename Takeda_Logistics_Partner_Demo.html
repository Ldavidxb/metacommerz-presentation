<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL — Pharma Cold Chain Integrity for Logistics Partners · AgenticVaults</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060B; --surface: #0E0E16; --surface2: #16161F; --surface3: #1C1C28;
    --border: #252535; --border-light: #2E2E40;
    --emerald: #34D399; --emerald-dim: rgba(52,211,153,0.12);
    --red: #F87171; --red-dim: rgba(248,113,113,0.12);
    --amber: #FBBF24; --amber-dim: rgba(251,191,36,0.12);
    --cyan: #22D3EE; --cyan-dim: rgba(34,211,238,0.12);
    --blue: #60A5FA; --blue-dim: rgba(96,165,250,0.12);
    --purple: #A78BFA; --purple-dim: rgba(167,139,250,0.12);
    --white: #F0EDE6; --muted: #8E8EA3; --dim: #55556A;
    --fd: 'Space Grotesk', sans-serif; --fb: 'DM Sans', sans-serif; --fm: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--white); font-family: var(--fb); overflow-x: hidden; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .fade-in { animation: fadeIn 0.4s ease-out both; }
  .app { display: flex; min-height: 100vh; }

  .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top:0; bottom:0; left:0; overflow-y:auto; }
  .brand { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-mark { width: 26px; height: 26px; border: 2px solid var(--emerald); border-radius: 7px; display:flex; align-items:center; justify-content:center; }
  .brand-mark div { width: 9px; height: 9px; background: var(--emerald); border-radius: 2px; }
  .brand-name { font-family: var(--fd); font-weight: 700; font-size: 14.5px; color: var(--emerald); letter-spacing: 0.03em; }
  .brand-sub { font-size: 10.5px; color: var(--dim); margin-left: 36px; }
  .context-box { margin: 16px 18px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .context-label { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .context-val { font-size: 12.5px; color: var(--white); font-weight: 600; line-height: 1.4; }

  .steps { padding: 8px 12px; flex: 1; }
  .step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
  .step:hover { background: var(--surface2); }
  .step.active { background: var(--cyan-dim); }
  .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; font-family: var(--fm); flex-shrink: 0; border: 1.5px solid var(--border-light); color: var(--dim); }
  .step.done .step-num { background: var(--emerald); border-color: var(--emerald); color: #04140d; }
  .step.active .step-num { border-color: var(--cyan); color: var(--cyan); }
  .step-label { font-size: 12.5px; color: var(--muted); font-weight: 500; line-height: 1.3; }
  .step.active .step-label, .step.done .step-label { color: var(--white); }
  .step.locked { opacity: 0.35; pointer-events: none; }

  .checklist-mini { margin: 10px 18px 20px; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; }
  .checklist-mini-title { font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display:flex; justify-content:space-between; }
  .mini-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--muted); }
  .mini-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background 0.4s; }
  .mini-dot.on { background: var(--emerald); }
  .mini-row.on { color: var(--white); }

  .main { margin-left: 280px; flex: 1; min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 10; background: rgba(6,6,11,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 40px; display:flex; align-items:center; justify-content: space-between; }
  .topbar-title { font-family: var(--fd); font-weight: 700; font-size: 17px; }
  .topbar-badge { font-family: var(--fm); font-size: 11px; color: var(--cyan); background: var(--cyan-dim); padding: 5px 12px; border-radius: 100px; border: 1px solid rgba(34,211,238,0.25); }
  .content { padding: 40px; max-width: 1100px; }

  h1.screen-title { font-family: var(--fd); font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .screen-sub { color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; max-width: 700px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px; margin-bottom: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

  .kv-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-key { color: var(--dim); }
  .kv-val { font-family: var(--fm); color: var(--white); font-weight: 500; }

  .btn { font-family: var(--fd); font-weight: 600; font-size: 14.5px; padding: 13px 26px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--cyan); color: #041014; }
  .btn-primary:hover { background: #4fe3f0; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--surface3); color: var(--dim); cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; border: 1px solid var(--border-light); color: var(--white); }
  .btn-ghost:hover { border-color: var(--cyan); }

  .callout { padding: 14px 18px; border-radius: 10px; border-left: 3px solid var(--emerald); background: rgba(52,211,153,0.06); font-size: 13.5px; color: var(--white); line-height: 1.6; margin: 18px 0; }
  .callout.cyan { border-left-color: var(--cyan); background: rgba(34,211,238,0.06); }
  .callout.red { border-left-color: var(--red); background: rgba(248,113,113,0.06); }
  .callout strong { color: var(--emerald); }
  .callout.cyan strong { color: var(--cyan); }
  .callout.red strong { color: var(--red); }

  .fleet-stat { text-align: center; padding: 22px; background: var(--surface2); border-radius: 12px; border: 1px solid var(--border); }
  .fleet-num { font-family: var(--fm); font-size: 27px; font-weight: 700; }
  .fleet-label { font-size: 11.5px; color: var(--dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

  .spinner { width: 15px; height: 15px; border: 2px solid rgba(4,16,20,0.3); border-top-color: #041014; border-radius: 50%; animation: spin 0.7s linear infinite; }
  .banner-done { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: var(--emerald-dim); border: 1px solid rgba(52,211,153,0.3); border-radius: 12px; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--emerald); }

  .row-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface2); border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
  .row-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .row-info { flex: 1; }
  .row-title { font-size: 13.5px; font-weight: 600; }
  .row-desc { font-size: 11.5px; color: var(--dim); }
  .row-status { font-family: var(--fm); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600; }

  .vis-row { display: flex; gap: 4px; align-items: center; margin: 6px 0; }
  .vis-cell { padding: 6px 10px; border-radius: 6px; font-size: 11px; font-family: var(--fm); }
  .vis-see { background: var(--emerald-dim); color: var(--emerald); border: 1px solid rgba(52,211,153,0.2); }
  .vis-no { background: var(--surface3); color: var(--dim); border: 1px solid var(--border); text-decoration: line-through; opacity: 0.6; }

  .handoff-arrow { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; color: var(--cyan); font-size: 12px; font-family: var(--fm); }

  .chart-area { position: relative; width: 100%; height: 160px; margin: 16px 0; }
  .chart-area canvas { width: 100%; height: 100%; }
  .chart-tooltip { position: absolute; background: var(--surface); border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 12px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 5; }
  .chart-tooltip .tt-time { color: var(--dim); font-family: var(--fm); }
  .chart-tooltip .tt-temp { font-family: var(--fm); font-weight: 600; font-size: 13px; }

  .cta-strip { margin-top: 40px; padding: 28px; background: linear-gradient(135deg, rgba(34,211,238,0.06), rgba(52,211,153,0.06)); border: 1px solid var(--border-light); border-radius: 14px; text-align: center; }
  .cta-strip h3 { font-family: var(--fd); font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .cta-strip p { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }
  .cta-strip .cta-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cta-strip a { text-decoration: none; }

  /* Mobile toggle button */
  .mobile-toggle { display: none; position: fixed; top: 14px; left: 14px; z-index: 100; width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--white); font-size: 20px; cursor: pointer; align-items: center; justify-content: center; }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .mobile-toggle { display: flex; }
    .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; z-index: 90; width: 280px; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 80; }
    .sidebar-overlay.open { display: block; }
    .main { margin-left: 0; }
    .topbar { padding: 14px 16px 14px 60px; }
    .topbar-title { font-size: 14px; }
    .topbar-badge { font-size: 9.5px; padding: 4px 8px; display: none; }
    .content { padding: 20px 16px; }
    h1.screen-title { font-size: 22px; }
    .screen-sub { font-size: 13.5px; margin-bottom: 20px; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; gap: 10px; }
    .fleet-stat { padding: 14px; }
    .fleet-num { font-size: 20px; }
    .fleet-label { font-size: 9.5px; }
    .card { padding: 18px; margin-bottom: 14px; }
    .kv-row { flex-direction: column; gap: 4px; padding: 8px 0; }
    .kv-val { font-size: 12px; }
    .row-item { flex-wrap: wrap; gap: 10px; padding: 12px; }
    .row-status { margin-left: auto; }
    .vis-row { flex-wrap: wrap; }
    .vis-cell { font-size: 10px; padding: 5px 8px; }
    .callout { font-size: 12.5px; padding: 12px 14px; }
    .banner-done { font-size: 12.5px; padding: 12px 14px; flex-wrap: wrap; }
    .btn { font-size: 13px; padding: 11px 20px; width: 100%; justify-content: center; }
    .cta-strip { padding: 20px 16px; }
    .cta-strip h3 { font-size: 15px; }
    .cta-strip .cta-btns { flex-direction: column; }
    .handoff-arrow { font-size: 10px; overflow-wrap: break-word; word-break: break-all; }
    .chart-area { height: 130px; }
  }
</style>
</head>
<body>

<div class="app">
  <button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark"><div></div></div>
        <span class="brand-name">agenticvaults</span>
      </div>
      <div class="brand-sub">SENTINEL · Logistics Integrity</div>
    </div>
    <div class="context-box">
      <div class="context-label">Partner Demonstration</div>
      <div class="context-val">Pharma Cold Chain — Zero-Knowledge Custody Proofs for Logistics Partners</div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="checklist-mini">
      <div class="checklist-mini-title"><span>Partner Benefits</span><span id="miniCount">0/6</span></div>
      <div id="miniList"></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topTitle">The Problem</div>
      <div class="topbar-badge" id="topBadge">Pharma Logistics · GDP-Compliant</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebarOverlay');
  const btn = document.getElementById('mobileToggle');
  const isOpen = sb.classList.contains('open');
  sb.classList.toggle('open');
  ov.classList.toggle('open');
  btn.textContent = isOpen ? '☰' : '✕';
}

const REQS = [
  {code: '1', label: 'Cold chain proof without cargo data'},
  {code: '2', label: 'Cryptographic custody receipt'},
  {code: '3', label: 'Zero breach liability'},
  {code: '4', label: 'False excursion protection'},
  {code: '5', label: 'Provider-agnostic handoff'},
  {code: '6', label: 'Competitive differentiation'},
];
const STEP_LABELS = [
  'The Trust Problem Today',
  'What You See vs. What You Don\'t',
  'Shipment Custody Handoff',
  'Cold Chain Proof (Your Sensors)',
  'Dispute Resolution (ZK Receipt)',
  'Multi-Pharma Scalability',
  'Breach Liability Elimination',
  'Your Competitive Advantage',
];

let state = { screen: 1, maxUnlocked: 1, reqStatus: [false,false,false,false,false,false] };
function setReq(idx, val) { state.reqStatus[idx] = val; renderSidebar(); }
function goTo(n) { if (n > state.maxUnlocked) return; state.screen = n; render(); if (window.innerWidth <= 768) { const sb = document.getElementById('sidebar'); if (sb.classList.contains('open')) toggleSidebar(); } }
function unlockNext() { state.maxUnlocked = Math.max(state.maxUnlocked, state.screen + 1); }

function renderSidebar() {
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    const cls = ['step'];
    if (n === state.screen) cls.push('active');
    else if (n < state.screen) cls.push('done');
    if (n > state.maxUnlocked) cls.push('locked');
    return `<div class="${cls.join(' ')}" onclick="goTo(${n})">
      <div class="step-num">${n < state.screen ? '✓' : n}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');
  const doneCount = state.reqStatus.filter(Boolean).length;
  document.getElementById('miniCount').textContent = doneCount + '/6';
  document.getElementById('miniList').innerHTML = REQS.map((r, i) => {
    const on = state.reqStatus[i];
    return `<div class="mini-row ${on ? 'on' : ''}"><div class="mini-dot ${on ? 'on' : ''}"></div>${r.label}</div>`;
  }).join('');
}

function screen1() {
  return `
  <h1 class="screen-title">The Trust Problem in Pharma Logistics</h1>
  <p class="screen-sub">You transport the world's most valuable biological products. You prove compliance every day. But the current model puts you in an impossible position.</p>
  <div class="grid-4" style="margin-bottom:24px;">
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--cyan);">$1.8M</div><div class="fleet-label">Value Per Plasma Pool</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--amber);">38 hrs</div><div class="fleet-label">Avg Transit (US)</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--red);">$47M</div><div class="fleet-label">Annual Excursion Losses</div></div>
    <div class="fleet-stat"><div class="fleet-num" style="color:var(--emerald);">0</div><div class="fleet-label">Tolerance for Error</div></div>
  </div>
  <div class="card">
    <div style="font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:14px; color:var(--red);">Today's Problems for Logistics Partners</div>
    <div class="row-item" style="border-color: rgba(248,113,113,0.3);">
      <div class="row-icon" style="background:var(--red-dim);">1</div>
      <div class="row-info"><div class="row-title" style="color:var(--red);">You're exposed to data you shouldn't hold</div><div class="row-desc">Shipping manifests reveal donor pool composition, product lot assignments, patient destinations. If your systems are breached, YOUR company is liable for HIPAA/GDPR violations on data you never needed.</div></div>
    </div>
    <div class="row-item" style="border-color: rgba(248,113,113,0.3);">
      <div class="row-icon" style="background:var(--red-dim);">2</div>
      <div class="row-info"><div class="row-title" style="color:var(--red);">No cryptographic proof you did your job</div><div class="row-desc">If a pharma client claims a temperature excursion, your paper-based temperature logs are disputable. PDF exports from data loggers can be questioned in court. You have no mathematically unforgeable proof of compliance.</div></div>
    </div>
    <div class="row-item" style="border-color: rgba(248,113,113,0.3);">
      <div class="row-icon" style="background:var(--red-dim);">3</div>
      <div class="row-info"><div class="row-title" style="color:var(--red);">Switching costs lock clients to you (and vice versa)</div><div class="row-desc">Every pharma client has a different data integration, different handoff protocol, different documentation format. Onboarding a new client takes months. Losing one is catastrophic because the integration cost is sunk.</div></div>
    </div>
  </div>
  <div class="callout red">
    <strong>The core issue:</strong> You're carrying $1.8M pools of human plasma. You need to prove temperature compliance. But you do NOT need to know which donors contributed, which patients will receive the product, or what the fractionation plan is. Today's systems force you to hold that data anyway — creating liability without benefit.
  </div>
  <div style="margin-top:16px;">
    <button class="btn btn-primary" onclick="unlockNext(); goTo(2)">See the Solution →</button>
  </div>`;
}

function screen2() {
  return `
  <h1 class="screen-title">What You See vs. What You Don't</h1>
  <p class="screen-sub">SENTINEL creates a clean separation: you see everything you need for your job. You never see anything that creates liability.</p>
  <div class="card">
    <div style="font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:18px;">Data Visibility Matrix</div>
    <div style="margin-bottom:12px; font-size:12px; font-weight:600; color:var(--cyan);">✓ YOU SEE (operational data for your job):</div>
    <div class="vis-row"><div class="vis-cell vis-see">Container count: 3</div><div class="vis-cell vis-see">Required temp: -25°C to -30°C</div><div class="vis-cell vis-see">Route: Indianapolis → LA</div></div>
    <div class="vis-row"><div class="vis-cell vis-see">Transit window: 38 hours max</div><div class="vis-cell vis-see">Pickup: BioLife Center #47</div><div class="vis-cell vis-see">Delivery: Frax Plant Gate 4</div></div>
    <div class="vis-row"><div class="vis-cell vis-see">GPS tracking: continuous</div><div class="vis-cell vis-see">Sensor logging: every 30s</div><div class="vis-cell vis-see">Alert threshold: -24.5°C</div></div>
    <div style="margin:18px 0 12px; font-size:12px; font-weight:600; color:var(--red);">✗ YOU NEVER SEE (protected by cryptography):</div>
    <div class="vis-row"><div class="vis-cell vis-no">Donor identities</div><div class="vis-cell vis-no">Pool composition</div><div class="vis-cell vis-no">Patient assignments</div></div>
    <div class="vis-row"><div class="vis-cell vis-no">Product lot numbers</div><div class="vis-cell vis-no">Traceability chain</div><div class="vis-cell vis-no">Clinical test results</div></div>
    <div class="vis-row"><div class="vis-cell vis-no">BioLife center donor data</div><div class="vis-cell vis-no">Fractionation parameters</div><div class="vis-cell vis-no">Batch record links</div></div>
  </div>
  <div class="callout cyan">
    <strong>Why this protects YOU:</strong> If your systems are breached tomorrow, the attacker gets temperature logs and GPS coordinates. They do NOT get donor health records, patient data, or proprietary product information. Your HIPAA/GDPR liability drops to zero for the pharma cargo. You cannot leak what you never held.
  </div>
  <div style="margin-top:16px;">
    <button class="btn btn-primary" onclick="setReq(2,true); unlockNext(); goTo(3)">See the Custody Handoff →</button>
  </div>`;
}

function screen3() {
  return `
  <h1 class="screen-title">Cryptographic Custody Handoff</h1>
  <p class="screen-sub">At each transfer point, SENTINEL generates a zero-knowledge custody proof. You confirm receipt. The pharma client confirms delivery. Neither party can later dispute what happened.</p>
  <div class="card">
    <div style="font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:14px;">Shipment: Plasma Pool → Fractionation</div>
    <div class="row-item" style="border-color: rgba(34,211,238,0.3);">
      <div class="row-icon" style="background:var(--cyan-dim);">🩸</div>
      <div class="row-info"><div class="row-title">Pickup — BioLife Center #47, Indianapolis</div><div class="row-desc">You scan containers. System confirms: 3 containers, -27.4°C at handoff, seals intact.</div></div>
      <div class="row-status" style="background:var(--emerald-dim); color:var(--emerald);">SEALED</div>
    </div>
    <div class="handoff-arrow">━━━ YOUR CUSTODY ━━━ sensors logging every 30s ━━━</div>

// Cold chain area chart
const CC_DATA = [];
(function(){
  let temp = -27.8;
  for (let i = 0; i < 76; i++) {
    const drift = (Math.sin(i*0.3)*0.6) + (Math.cos(i*0.13)*0.4);
    temp = Math.max(-30, Math.min(-25, -27.4 + drift + (i===54 ? 2.3 : 0)));
    CC_DATA.push({ hour: (i*0.5).toFixed(1), temp: +temp.toFixed(2) });
  }
})();

function drawColdChart() {
  const canvas = document.getElementById('coldChart');
  if (!canvas) return;
  const wrap = document.getElementById('coldChartWrap');
  const tooltip = document.getElementById('coldTooltip');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { top: 16, bottom: 24, left: 44, right: 16 };
  const cw = w - pad.left - pad.right, ch = h - pad.top - pad.bottom;
  const minT = -30.5, maxT = -24.5;
  const toX = i => pad.left + (i / (CC_DATA.length - 1)) * cw;
  const toY = t => pad.top + ((maxT - t) / (maxT - minT)) * ch;

  ctx.strokeStyle = 'rgba(37,37,53,0.7)'; ctx.lineWidth = 0.5;
  [-25, -26, -27, -28, -29, -30].forEach(t => {
    const y = toY(t);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#55556A'; ctx.font = '10px JetBrains Mono';
    ctx.fillText(t + '°C', 4, y + 3);
  });

  ctx.fillStyle = 'rgba(248,113,113,0.04)';
  ctx.fillRect(pad.left, pad.top, cw, toY(-25) - pad.top);
  ctx.fillStyle = 'rgba(52,211,153,0.04)';
  ctx.fillRect(pad.left, toY(-25), cw, toY(-30) - toY(-25));

  ctx.setLineDash([4,4]); ctx.strokeStyle = 'rgba(248,113,113,0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, toY(-25)); ctx.lineTo(w-pad.right, toY(-25)); ctx.stroke();
  ctx.strokeStyle = 'rgba(96,165,250,0.3)';
  ctx.beginPath(); ctx.moveTo(pad.left, toY(-30)); ctx.lineTo(w-pad.right, toY(-30)); ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(CC_DATA[0].temp));
  CC_DATA.forEach((d, i) => { if(i>0) ctx.lineTo(toX(i), toY(d.temp)); });
  ctx.lineTo(toX(CC_DATA.length-1), toY(-30));
  ctx.lineTo(toX(0), toY(-30));
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, toY(-25), 0, toY(-30));
  grad.addColorStop(0, 'rgba(34,211,238,0.25)');
  grad.addColorStop(1, 'rgba(34,211,238,0.02)');
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  CC_DATA.forEach((d, i) => { i === 0 ? ctx.moveTo(toX(i), toY(d.temp)) : ctx.lineTo(toX(i), toY(d.temp)); });
  ctx.strokeStyle = 'var(--cyan)'; ctx.lineWidth = 2; ctx.stroke();

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const idx = Math.round(((mx - pad.left) / cw) * (CC_DATA.length - 1));
    if (idx < 0 || idx >= CC_DATA.length) { tooltip.style.opacity = '0'; return; }
    const d = CC_DATA[idx];
    tooltip.querySelector('.tt-time').textContent = 'Hour ' + d.hour;
    const color = d.temp > -25.5 ? 'var(--amber)' : 'var(--cyan)';
    tooltip.querySelector('.tt-temp').innerHTML = `<span style="color:${color}">${d.temp.toFixed(1)}°C</span>`;
    tooltip.style.opacity = '1';
    tooltip.style.left = Math.min(mx + 12, w - 120) + 'px';
    tooltip.style.top = (toY(d.temp) - 40) + 'px';
  };
  canvas.onmouseleave = () => { tooltip.style.opacity = '0'; };
}
