  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';

      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];

div>\n    <div style=\"flex:1\"></div>\n    <div sc-camel-on-click=\"{{ onOpenWho }}\" style=\"display:flex;align-items:center;gap:9px;padding:6px 13px;border-radius:20px;border:1px solid rgba(255,153,0,.28);background:rgba(255,153,0,.06);cursor:pointer;flex-shrink:0\" style-hover=\"border-color:rgba(255,153,0,.6)\">\n      <span style=\"width:6px;height:6px;border-radius:50%;background:#FF9900;animation:fsPulse 2.3s infinite\"></span>\n      <span style=\"font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.09em;color:#FFB865;white-space:nowrap\">PREPARED FOR DAVID RANDLE</span>\n    </div>\n  </header>\n\n  <section style=\"max-width:1340px;margin:0 auto;padding:clamp(30px,4vw,52px) clamp(16px,3vw,40px) clamp(22px,2.6vw,32px)\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n      <span style=\"height:1px;width:30px;background:#2DD4BF\"></span>\n      <span style=\"font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#2DD4BF\">Physical AI \u00b7 fleet security &amp; compliance</span>\n    </div>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:clamp(24px,3.4vw,48px);align-items:start\">\n      <div>\n        <h1 style=\"margin:0;font:700 clamp(27px,4vw,47px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.03em;color:#F0EDE6;text-wrap:balance\">AWS IoT moves the data. <span style=\"color:#2DD4BF\">We make the device worth trusting.</span></h1>\n\n        <p style=\"margin:20px 0 0;font:400 clamp(14.5px,1.35vw,17.5px)/1.6 'DM Sans',sans-serif;color:#8E8EA3;max-width:600px;text-wrap:pretty\">Post-quantum device identity, brownfield fleet migration with no firmware change, tamper-evident regulator evidence, and sovereign operation with no uplink. Shipped and in production with <strong style=\"color:#F0EDE6;font-weight:600\">Roche</strong> and <strong style=\"color:#F0EDE6;font-weight:600\">Sandoz</strong>.</p>\n\n        <div style=\"display:flex;gap:11px;margin-top:26px;flex-wrap:wrap\">\n          <div sc-camel-on-click=\"{{ onRunFromHero }}\" style=\"height:46px;padding:0 21px;display:flex;align-items:center;gap:10px;border-radius:10px;background:#2DD4BF;color:#04201C;font:700 14.5px 'Space Grotesk',sans-serif;cursor:pointer\" style-hover=\"background:#5BE5D3\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M5 3l14 9-14 9V3z\"></path></svg>\n            Scan a brownfield fleet\n          </div>\n          <a href=\"#ask\" style=\"height:46px;padding:0 21px;display:flex;align-items:center;border-radius:10px;border:1px solid #2E2E42;color:#F0EDE6;font:600 14.5px 'Space Grotesk',sans-serif\" style-hover=\"border-color:#FF9900;background:rgba(255,153,0,.06)\">The ask \u2192</a>\n        </div>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:#252535;border:1px solid #252535;border-radius:13px;overflow:hidden;margin-top:28px\">\n          <sc-for list=\"{{ proof }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ onOpenStat }}\" data-id=\"{{ p.id }}\" style=\"background:#0E0E16;padding:15px 16px;cursor:pointer\" style-hover=\"background:#16161F\">\n              <div style=\"font:700 clamp(15.5px,1.65vw,19px)/1 'JetBrains Mono',monospace;letter-spacing:-.02em;color:{{ p.color }}\">{{ p.v }}</div>\n              <div style=\"font:400 10.5px/1.4 'DM Sans',sans-serif;color:#55556A;margin-top:7px\">{{ p.k }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"border:1px solid rgba(45,212,191,.2);border-radius:18px;background:linear-gradient(180deg,#0E0E16,#0A0A11);padding:clamp(16px,1.9vw,22px);box-shadow:0 26px 74px rgba(0,0,0,.5)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px\">\n          <div>\n            <div style=\"font:600 12.5px 'Space Grotesk',sans-serif;color:#F0EDE6\">Where we sit in a deployment</div>\n            <div style=\"font:400 10.5px 'DM Sans',sans-serif;color:#55556A;margin-top:3px\">Tap any stage \u00b7 customers run all of it</div>\n          </div>\n          <span style=\"font:600 9px 'JetBrains Mono',monospace;letter-spacing:.11em;color:#55556A;flex-shrink:0\">DATA FLOW</span>\n        </div>\n\n        <div style=\"display:flex;flex-direction:column;gap:0\">\n          <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div>\n              <div sc-camel-on-click=\"{{ onOpenStage }}\" sc-camel-on-mouse-enter=\"{{ onStageEnter }}\" sc-camel-on-mouse-leave=\"{{ onStageLeave }}\" data-id=\"{{ s.id }}\" style=\"{{ s.style }}\">\n                <div style=\"display:flex;align-items:center;gap:12px\">\n                  <span style=\"{{ s.tagStyle }}\">{{ s.tag }}</span>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font:600 {{ s.nameSize }} 'Space Grotesk',sans-serif;letter-spacing:-.012em;color:{{ s.nameColor }}\">{{ s.name }}</div>\n                    <div style=\"font:400 10.5px/1.45 'DM Sans',sans-serif;color:#7B7B8E;margin-top:3px;text-wrap:pretty\">{{ s.role }}</div>\n                  </div>\n                  <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#55556A\" stroke-width=\"2\" style=\"flex-shrink:0\"><path d=\"M9 18l6-6-6-6\"></path></svg>\n                </div>\n                <sc-if value=\"{{ s.isOurs }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(45,212,191,.2)\">\n                    <sc-for list=\"{{ s.modules }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                        <span style=\"width:5px;height:5px;border-radius:1px;flex-shrink:0;margin-top:6px;background:{{ m.color }}\"></span>\n                        <div style=\"flex:1;min-width:0\">\n                          <span style=\"font:600 11.5px 'JetBrains Mono',monospace;color:{{ m.color }}\">{{ m.n }}</span>\n                          <span style=\"font:400 11.5px/1.5 'DM Sans',sans-serif;color:#9A9AAE\"> \u00b7 {{ m.d }}</span>\n                        </div>\n                      </div>\n                    </sc-for>\n                  </div>\n                </sc-if>\n              </div>\n              <sc-if value=\"{{ s.hasArrow }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:7px 0 7px 21px\">\n                  <svg width=\"13\" height=\"15\" sc-camel-view-box=\"0 0 13 15\" fill=\"none\" stroke=\"{{ s.arrowColor }}\" stroke-width=\"1.6\" style=\"flex-shrink:0;animation:fsFlow 2.6s ease-in-out infinite\"><path d=\"M6.5 1v12M2 9l4.5 4.5L11 9\"></path></svg>\n                  <span style=\"font:400 9.5px 'JetBrains Mono',monospace;letter-spacing:.05em;color:#4E5768\">{{ s.arrowLabel }}</span>\n                </div>\n              </sc-if>\n            </div>\n          </sc-for>\n        </div>\n\n        <div style=\"margin-top:14px;padding:11px 14px;border-radius:10px;background:rgba(255,153,0,.06);border:1px solid rgba(255,153,0,.2);font:400 11px/1.5 'DM Sans',sans-serif;color:#C9C0B4;text-wrap:pretty\"><strong style=\"color:#FF9900;font-weight:600\">No overlap.</strong> We secure and evidence the device. AWS carries and computes on the result. Customers buy both.</div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"scan\" style=\"border-top:1px solid #252535;padding:clamp(36px,4.4vw,64px) clamp(16px,3vw,40px)\">\n    <div style=\"max-width:1340px;margin:0 auto\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px\">\n        <div style=\"max-width:640px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:15px\">\n            <span style=\"height:1px;width:30px;background:#22D3EE\"></span>\n            <span style=\"font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#22D3EE\">The working demo</span>\n          </div>\n          <h2 style=\"margin:0;font:700 clamp(22px,2.6vw,32px)/1.13 'Space Grotesk',sans-serif;letter-spacing:-.022em;color:#F0EDE6\">A real brownfield fleet. Five questions the regulator asks.</h2>\n          <p style=\"margin:13px 0 0;font:400 clamp(13.5px,1.1vw,15.5px)/1.6 'DM Sans',sans-serif;color:#8E8EA3;text-wrap:pretty\">2,412 devices, oldest commissioned in 2011. Run the scan against the estate as it stands today, then against the same estate after migration \u2014 no firmware touched, no device replaced.</p>\n        </div>\n        <div style=\"display:flex;gap:9px;flex-shrink:0\">\n          <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ onMode }}\" data-mode=\"{{ m.key }}\" style=\"{{ m.style }}\">\n              <span style=\"{{ m.dotStyle }}\"></span>\n              {{ m.label }}\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"border:1px solid #252535;border-radius:18px;background:#0A0A11;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 19px;border-bottom:1px solid #252535;background:rgba(255,255,255,.014);flex-wrap:wrap\">\n          <div style=\"display:flex;align-items:center;gap:13px;min-width:0;flex-wrap:wrap\">\n            <span style=\"font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.07em;color:#8E8EA3\">FLEET AV-EU-2412 \u00b7 2011\u20132026 VINTAGE</span>\n            <span style=\"{{ simBadgeStyle }}\">{{ simBadge }}</span>\n          </div>\n          <div style=\"display:flex;align-items:center;gap:9px\">\n            <div sc-camel-on-click=\"{{ onRun }}\" style=\"{{ runStyle }}\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"{{ runIcon }}\"></path></svg>\n              {{ runLabel }}\n            </div>\n            <div sc-camel-on-click=\"{{ onReset }}\" style=\"height:33px;padding:0 13px;display:flex;align-items:center;border-radius:9px;border:1px solid #2E2E42;color:#8E8EA3;font:500 12px 'DM Sans',sans-serif;cursor:pointer\" style-hover=\"border-color:#55556A;color:#F0EDE6\">Reset</div>\n          </div>\n        </div>\n\n        <div style=\"position:relative\">\n          <sc-if value=\"{{ scanning }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:0;bottom:0;left:0;width:22%;pointer-events:none;z-index:1;background:linear-gradient(90deg,rgba(45,212,191,0),rgba(45,212,191,.075),rgba(45,212,191,0));animation:fsScan 1.45s linear infinite\"></div>\n          </sc-if>\n\n          <sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ onOpenCheck }}\" data-id=\"{{ c.id }}\" style=\"{{ c.rowStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:16px;flex:1;min-width:0\">\n                <div style=\"{{ c.numStyle }}\">{{ c.n }}</div>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 13px 'Space Grotesk',sans-serif;color:{{ c.titleColor }}\">{{ c.q }}</div>\n                  <div style=\"font:400 11.5px/1.5 'DM Sans',sans-serif;color:#8E8EA3;margin-top:4px;text-wrap:pretty\">{{ c.a }}</div>\n                </div>\n              </div>\n              <div style=\"display:flex;align-items:center;gap:13px;flex-shrink:0\">\n                <span style=\"{{ c.badgeStyle }}\">{{ c.badge }}</span>\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#55556A\" stroke-width=\"2\"><path d=\"M9 18l6-6-6-6\"></path></svg>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:#252535;border-top:1px solid #252535\">\n          <sc-for list=\"{{ verdict }}\" as=\"v\" hint-placeholder-count=\"4\">\n            <div style=\"background:#0E0E16;padding:18px clamp(15px,2vw,21px)\">\n              <div style=\"font:600 8.5px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#55556A\">{{ v.k }}</div>\n              <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:10px\">\n                <span style=\"font:700 clamp(19px,2.1vw,26px)/1 'Space Grotesk',sans-serif;letter-spacing:-.03em;color:{{ v.color }};transition:color .4s\">{{ v.v }}</span>\n                <span style=\"font:400 10.5px 'DM Sans',sans-serif;color:#55556A\">{{ v.note }}</span>\n              </div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"{{ closerStyle }}\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:{{ closerAccent }};flex-shrink:0;margin-top:6px\"></span>\n        <div style=\"flex:1;min-width:0\">\n          <p style=\"margin:0;font:400 clamp(13px,1.05vw,15px)/1.65 'DM Sans',sans-serif;color:#B4B4C4;text-wrap:pretty\">{{ closer }}</p>\n          <sc-if value=\"{{ hasNext }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:11px;margin-top:14px;flex-wrap:wrap\">\n              <div sc-camel-on-click=\"{{ onNext }}\" style=\"{{ nextStyle }}\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"{{ nextIcon }}\"></path></svg>\n                {{ nextLabel }}\n              </div>\n              <span style=\"font:400 11px 'JetBrains Mono',monospace;color:#55556A\">{{ nextHint }}</span>\n            </div>\n          </sc-if>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"border-top:1px solid #252535;padding:clamp(36px,4.4vw,64px) clamp(16px,3vw,40px)\">\n    <div style=\"max-width:1340px;margin:0 auto\">\n      <div style=\"max-width:640px;margin-bottom:20px\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:15px\">\n          <span style=\"height:1px;width:30px;background:#34D399\"></span>\n          <span style=\"font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#34D399\">Shipped, not roadmapped</span>\n        </div>\n        <h2 style=\"margin:0;font:700 clamp(22px,2.6vw,32px)/1.13 'Space Grotesk',sans-serif;letter-spacing:-.022em;color:#F0EDE6\">In production. Through pharma procurement. Twice.</h2>\n      </div>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:14px\">\n        <sc-for list=\"{{ customers }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ onOpenCustomer }}\" data-id=\"{{ c.id }}\" style=\"{{ c.cardStyle }}\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div style=\"min-width:0\">\n                <div style=\"font:700 clamp(17px,1.8vw,21px) 'Space Grotesk',sans-serif;letter-spacing:-.015em;color:#F0EDE6\">{{ c.name }}</div>\n                <div style=\"font:400 10.5px 'JetBrains Mono',monospace;letter-spacing:.05em;color:#55556A;margin-top:5px\">{{ c.sector }}</div>\n              </div>\n              <span style=\"{{ c.badgeStyle }}\">{{ c.stage }}</span>\n            </div>\n            <p style=\"margin:14px 0 0;font:400 12.5px/1.6 'DM Sans',sans-serif;color:#8E8EA3;text-wrap:pretty\">{{ c.what }}</p>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #252535\">\n              <sc-for list=\"{{ c.stats }}\" as=\"s\" hint-placeholder-count=\"2\">\n                <div>\n                  <div style=\"font:600 8.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#55556A\">{{ s.k }}</div>\n                  <div style=\"font:600 14px 'Space Grotesk',sans-serif;color:{{ s.color }};margin-top:6px\">{{ s.v }}</div>\n                </div>\n              </sc-for>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"ask\" style=\"border-top:1px solid #252535;padding:clamp(36px,4.4vw,64px) clamp(16px,3vw,40px) clamp(44px,5vw,70px)\">\n    <div style=\"max-width:1340px;margin:0 auto\">\n      <div style=\"border:1px solid rgba(255,153,0,.26);border-radius:20px;background:linear-gradient(160deg,rgba(255,153,0,.07),rgba(14,14,22,.6) 58%),#0A0A11;padding:clamp(22px,3vw,38px)\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,44px);align-items:center\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:15px\">\n              <span style=\"height:1px;width:30px;background:#FF9900\"></span>\n              <span style=\"font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#FF9900\">The ask</span>\n            </div>\n            <h2 style=\"margin:0;font:700 clamp(22px,2.7vw,33px)/1.13 'Space Grotesk',sans-serif;letter-spacing:-.024em;color:#F0EDE6;text-wrap:balance\">Fifteen minutes at the event on 2 September.</h2>\n            <p style=\"margin:15px 0 0;font:400 clamp(13.5px,1.1vw,15.5px)/1.62 'DM Sans',sans-serif;color:#8E8EA3;max-width:500px;text-wrap:pretty\">One question: is this a co-sell conversation worth having? We close regulated Physical AI deals that stall without this layer \u2014 and every one of them runs on AWS.</p>\n\n            <div s carries the data once we've made the device trustworthy.\u201d</p>\n            <div style=\"height:1px;background:#252535;margin:20px 0\"></div>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n              <sc-for list=\"{{ askFacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"font:600 8.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#55556A\">{{ f.k }}</div>\n                  <div style=\"font:600 13px 'Space Grotesk',sans-serif;color:{{ f.color }};margin-top:6px\">{{ f.v }}</div>\n                </div>\n              </sc-for>\n            </div>\n            <div sc-camel-on-click=\"{{ onBook }}\" style=\"height:44px;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:11px;background:#FF9900;color:#111;font:700 14px 'Space Grotesk',sans-serif;cursor:pointer\" style-hover=\"background:#FFB133\">\n              Book the fifteen minutes\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:26px\">\n        <span style=\"font:400 11px 'JetBrains Mono',monospace;color:#55556A\">agenticvaults \u00b7 fleet security &amp; compliance for Physical AI</span>\n        <span style=\"font:400 11px 'JetBrains Mono',monospace;color:#55556A\">Prepared for AWS Physical AI \u00b7 2 Sep</span>\n      </div>\n    </div>\n  </section>\n\n  <sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div sc-camel-on-click=\"{{ onClose }}\" style=\"position:fixed;inset:0;background:rgba(4,4,9,.68);backdrop-filter:blur(3px);z-index:60\"></div>\n      <aside style=\"position:fixed;top:0;right:0;bottom:0;width:460px;max-width:93vw;z-index:61;background:#0A0A11;border-left:1px solid #2E2E42;box-shadow:-30px 0 90px rgba(0,0,0,.74);display:flex;flex-direction:column;animation:fsSlide .24s cubic-bezier(.2,.8,.2,1) both\">\n        <div style=\"padding:23px 25px 19px;border-bottom:1px solid #252535\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px\">\n            <div style=\"{{ dIconStyle }}\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ dIcon }}\"></path></svg>\n            </div>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                <span style=\"font:500 9.5px 'JetBrains Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:#55556A\">{{ dKind }}</span>\n                <span style=\"{{ dBadgeStyle }}\">{{ dBadge }}</span>\n              </div>\n              <h3 style=\"margin:8px 0 0;font:700 17px/1.3 'Space Grotesk',sans-serif;letter-spacing:-.014em;color:#F0EDE6\">{{ dTitle }}</h3>\n              <p style=\"margin:7px 0 0;font:400 12px/1.55 'DM Sans',sans-serif;color:#8E8EA3;text-wrap:pretty\">{{ dSub }}</p>\n            </div>\n            <div sc-camel-on-click=\"{{ onClose }}\" style=\"width:28px;height:28px;border-radius:8px;border:1px solid #2E2E42;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0\" style-hover=\"background:rgba(255,255,255,.06)\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8E8EA3\" stroke-width=\"2\"><path d=\"M18 6L6 18M6 6l12 12\"></path></svg>\n            </div>\n          </div>\n        </div>\n\n        <div style=\"flex:1;overflow-y:auto;padding:21px 25px 42px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n            <sc-for list=\"{{ dStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"padding:13px 14px;border:1px solid #252535;border-radius:12px;background:#12121B\">\n                <div style=\"font:600 8.5px 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#55556A\">{{ s.k }}</div>\n                <div style=\"font:700 15.5px 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-top:8px;color:{{ s.color }}\">{{ s.v }}</div>\n              </div>\n            </sc-for>\n          </div>\n\n          <sc-if value=\"{{ dHasBody }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:21px;padding:16px 17px;border:1px solid #252535;border-radius:12px;background:#12121B\">\n              <div style=\"font:600 9px 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#55556A\">{{ dBodyLabel }}</div>\n              <p style=\"margin:9px 0 0;font:400 12.5px/1.68 'DM Sans',sans-serif;color:#B4B4C4;text-wrap:pretty\">{{ dBody }}</p>\n            </div>\n          </sc-if>\n\n          <div style=\"font:600 9px 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#55556A;margin:23px 0 11px\">{{ dListLabel }}</div>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ dList }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid #252535;border-radius:11px;background:#12121B\">\n                <span style=\"width:6px;height:6px;border-radius:2px;flex-shrink:0;margin-top:5px;background:{{ l.color }}\"></span>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:500 12.5px/1.5 'DM Sans',sans-serif;color:#F0EDE6;text-wrap:pretty\">{{ l.a }}</div>\n                  <div style=\"font:400 10.5px 'JetBrains Mono',monospace;color:#55556A;margin-top:4px\">{{ l.b }}</div>\n                </div>\n              </div>\n            </sc-for>\n          </div>\n\n          <div sc-camel-on-click=\"{{ onBook }}\" style=\"height:42px;margin-top:25px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,153,0,.42);background:rgba(255,153,0,.09);color:#FF9900;font:700 13px 'Space Grotesk',sans-serif;cursor:pointer\" style-hover=\"background:rgba(255,153,0,.18)\">Book the fifteen minutes</div>\n        </div>\n      </aside>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:11px;padding:13px 20px;border-radius:12px;background:#1E1E2A;border:1px solid #2E2E42;box-shadow:0 22px 60px rgba(0,0,0,.6);animation:fsUp .22s ease both;max-width:92vw\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#34D399;flex-shrink:0\"></span>\n      <span style=\"font:500 12.5px 'DM Sans',sans-serif;color:#F0EDE6\">{{ toast }}</span>\n    </div>\n  </sc-if>\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360},&quot;recipientName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;David Randle&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;eventDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 September&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;autoRun&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;stepMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:760,&quot;min&quot;:300,&quot;max&quot;:1600,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nconst C = {\n  aws:'#FF9900', teal:'#2DD4BF', emerald:'#34D399', cyan:'#22D3EE', blue:'#3B82F6',\n  purple:'#A78BFA', red:'#F87171', amber:'#FBBF24',\n  white:'#F0EDE6', muted:'#8E8EA3', dim:'#55556A',\n};\nconst SANS = \"'DM Sans',sans-serif\", DISP = \"'Space Grotesk',sans-serif\", MONO = \"'JetBrains Mono',monospace\";\n\n/**\n * Data-flow pipeline, not a layer hierarchy. Our stage is the widest and the\n * only one that enumerates modules \u2014 the visual argument for peer, not substrate.\n */\nconst STAGES = [\n  { id:'fleet', own:'hw', tag:'HW', name:'Physical fleet', role:'2,412 devices \\u00b7 robots, reefers, connected instrumentation \\u00b7 oldest commissioned 2011',\n    arrow:'raw telemetry \\u00b7 legacy protocols, classical crypto', arrowColor:'#55556A',\n    body:'Long-lived, physically reachable, frequently offline, and mostly older than any post-quantum standard. A ten-year field life outlasts the remaining safe life of RSA-2048.',\n    stats:[['Devices','2,412'],['Oldest','2011'],['Field life','8\\u201315 yrs'],['Offline window','up to 72h']],\n    list:[['Cannot be re-flashed at scale','warranty & validation'],['Cannot be replaced','capex + requalification'],['Must still satisfy the regulator','FDA / IEC / CNSA']] },\n\n  { id:'av', own:'ours', tag:'av', name:'agenticvaults', role:'Fleet security &amp; compliance platform \\u2014 the product layer',\n    arrow:'secured, post-quantum, evidence-bearing data', arrowColor:C.teal,\n    modules:[\n      { n:'Edge SDK', d:'ML-DSA-65 device identity, /1024 sessions, signed actuation chain', color:C.teal },\n      { n:'PQC Migration', d:'scans the estate, wraps legacy protocols \\u2014 no firmware change, no device swap', color:C.cyan },\n      { n:'FleetCam', d:'encrypted RTSP with tamper-evident custody for visual evidence', color:C.purple },\n      { n:'Sovereign runtime', d:'72h offline key cache \\u00b7 FDA 21 CFR 11 / IEC 62443 / CNSA 2.0 evidence', color:C.emerald },\n    ],\n    body:'This is a product with its own enterprise buyer, its own security-review motion and its own P&L \\u2014 not a library. It runs on AWS, sells alongside AWS, and does the work AWS IoT was never built to do.',\n    stats:[['Modules','4 shipped'],['Identity','ML-DSA-65'],['Sessions','ML-KEM-768/1024'],['Firmware changes','0']],\n    list:[['Post-quantum device identity','FIPS 204'],['Brownfield migration without re-flashing','the moat'],['Tamper-evident regulator evidence','per device'],['Sovereign operation, no uplink','72h+']] },\n\n  { id:'iot', own:'aws', tag:'AWS', name:'AWS IoT Core &amp; Greengrass', role:'Transport and edge runtime \\u2014 carries what we have secured',\n    arrow:'to cloud', arrowColor:C.aws,\n    body:'Best-in-class device connectivity, deployment management and edge compute. It moves and manages data extremely well; provisioning post-quantum cryptographic identity is simply not its job.',\n    stats:[['Role','transport + runtime'],['We replace','nothing'],['Overlap','none'],['Customers run','both']],\n    list:[['MQTT transport and device management','AWS native'],['Edge runtime and deployments','AWS native'],['Our data arrives already secured','post-quantum']] },\n\n  { id:'cloud', own:'aws', tag:'AWS', name:'AWS Cloud', role:'Bedrock, SageMaker, S3 \\u2014 where the value gets extracted',\n    body:'Every deal we close consumes AWS compute, storage and inference. Securing the fleet is what unblocks the regulated buyer who would otherwise never send that data to the cloud at all.',\n    stats:[['Services','Bedrock, SageMaker, S3'],['Consumption','grows with fleet'],['Blocker removed','security review'],['Net effect','AWS revenue']],\n    list:[['Model training and inference','AWS native'],['We unblock regulated data reaching it','security review'],['Larger fleet, larger AWS spend','aligned incentive']] },\n];\n\n/** Five questions a regulator or enterprise security team asks about the estate. */\nconst CHECKS = [\n  { id:'ident', n:'1', q:'What identifies each device, and does it survive the quantum transition?',\n    base:{ s:'fail', a:'Mixed: X.509 RSA-2048 on newer units, pre-shared keys on 617 legacy devices. 41% predate any rotation policy.',\n      body:'A brownfield estate is never uniform. The devices commissioned in 2011 were never designed to hold an asymmetric identity at all, which is why the usual answer is \"replace the fleet\" \\u2014 and why nobody does it.',\n      stats:[['Strongest','RSA-2048'],['Weakest','pre-shared key'],['No rotation','41%'],['Quantum-safe','0%']] },\n    av:{ s:'pass', a:'ML-DSA-65 identity provisioned to all 2,412 devices, including the 2011 units. No firmware was modified.',\n      body:'PQC Migration provisions identity into the secure element where one exists, and wraps the device at the protocol boundary where one does not. The legacy device keeps its firmware and gains a post-quantum identity.',\n      stats:[['Identity','ML-DSA-65'],['Coverage','2,412 / 2,412'],['Firmware changes','0'],['Quantum-safe','100%']] } },\n\n  { id:'legacy', n:'2', q:'What do you do about the devices that cannot be re-flashed?',\n    base:{ s:'fail', a:'617 devices run a 2011 telematics protocol with no crypto agility. Vendor is gone. Re-flashing voids validation.',\n      body:'This is the question that ends most Physical AI security programmes. Re-flashing a validated pharma asset triggers requalification, the original vendor no longer exists, and replacement is an eight-figure capex line.',\n      stats:[['Un-flashable','617'],['Protocol vintage','2011'],['Vendor support','none'],['Options','replace fleet']] },\n    av:{ s:'pass', a:'All 617 wrapped at the protocol boundary in post-quantum tunnels. Original firmware untouched, validation intact.',\n      body:'The legacy protocol is encapsulated rather than replaced. The device speaks its native 2011 dialect to us; we speak ML-KEM-768/1024 to everything upstream. Validation status is preserved because nothing on the device changed.',\n      stats:[['Wrapped','617 / 617'],['Firmware changes','0'],['Requalification','not triggered'],['Capex avoided','fleet replacement']] } },\n\n  { id:'prov', n:'3', q:'Which model authorised that physical actuation?',\n    base:{ s:'fail', a:'Actuations appear in application logs. Nothing cryptographically binds an action to the model version that caused it.',\n      body:'The question that arrives after an incident. Logs establish roughly what happened; they cannot prove to a regulator which model weights authorised a specific movement of a physical machine.',\n      stats:[['Logged','yes'],['Model bound','no'],['Non-repudiable','no'],['Post-incident','reconstructed']] },\n    av:{ s:'pass', a:'Every actuation signed with the model version inside the envelope. Replayable per device, per second.',\n      body:'Observe-orient-decide-act is signed as a chain with model identity bound in. After an incident you replay the exact decision path instead of reconstructing a narrative from logs.',\n      stats:[['Logged','yes'],['Model bound','signed'],['Non-repudiable','ML-DSA-65'],['Post-incident','replayable']] } },\n\n  { id:'off', n:'4', q:'What happens when the site loses connectivity for three days?',\n    base:{ s:'fail', a:'Data buffers locally, but key lifecycle and policy evaluation need the uplink. Past 24h, devices drop or run unattested.',\n      body:'Data survives the outage; trust does not. Beyond the buffer window the operator chooses between halting a production line and running equipment with no valid attestation \\u2014 and the second option is what actually happens.',\n      stats:[['Data buffering','yes'],['Trust continuity','no'],['Proven window','< 24h'],['Failure mode','unattested']] },\n    av:{ s:'pass', a:'Sovereign runtime holds a 72h key cache. Attestation and evidence continue locally with no uplink at all.',\n      body:'Verification runs at the edge against locally held material, so the chain is unbroken through the outage. Nothing is retro-signed on reconnect \\u2014 each record was created and signed at the moment of the event.',\n      stats:[['Data buffering','yes'],['Trust continuity','yes'],['Proven window','72h+'],['Retro-signing','none']] } },\n\n  { id:'eviid', n:'5', q:'Can you hand the regulator per-device evidence without a project?',\n    base:{ s:'fail', a:'Evidence assembled by hand from six systems. Last submission took 19 days and four people, with no chain of custody.',\n      body:'Nothing in a hand-assembled bundle can prove it was not edited after the fact, which is the question that actually gets asked. The effort also scales linearly with fleet size, so it gets worse as the deployment succeeds.',\n      stats:[['Prep time','19 days'],['People','4'],['Chain of custody','none'],['Re-runnable','no']] },\n    av:{ s:'pass', a:'Per-device evidence generated continuously against FDA 21 CFR 11, IEC 62443 and CNSA 2.0. Exported in minutes.',\n      body:'Evidence is a signed by-product of normal operation rather than a reporting project. Because each artefact was signed when written, the bundle proves its own integrity and regenerates for any device and window on demand.',\n      stats:[['Prep time','minutes'],['People','0'],['Chain of custody','signed'],['Re-runnable','any window']] } },\n];\n\nconst CUSTOMERS = [\n  { id:'roche', name:'Roche', sector:'Pharmaceutical \\u00b7 EU', stage:'production', accent:C.emerald,\n    what:'Post-quantum identity and evidence across connected instrumentation and cold-chain assets, including devices the OEM no longer supports.',\n    stats:[['Stage','Production'],['Since','2025']],\n    body:'Started as a security-review blocker rather than an innovation pilot, which is why it reached production. The deciding demonstration was migrating unsupported legacy assets without triggering requalification.',\n    list:[['Cleared enterprise security review','no exceptions'],['Legacy assets migrated in place','no re-flash'],['Runs on their existing AWS estate','no app change']] },\n  { id:'sandoz', name:'Sandoz', sector:'Pharmaceutical \\u00b7 EU', stage:'production', accent:C.emerald,\n    what:'Signed decision provenance across a multi-site IoT fleet, with sovereign key custody written into the contract as a condition.',\n    stats:[['Stage','Production'],['Since','2025']],\n    body:'Sovereign custody decided it. They needed to state in writing that no third party \\u2014 including the hyperscaler \\u2014 could use a device key. Neither AWS nor a classical PKI vendor could give them that sentence.',\n    list:[['Sovereign custody in contract','no third-party access'],['Multi-site signed provenance','per actuation'],['Procurement condition met','key custody']] },\n  { id:'schneider', name:'Schneider Electric', sector:'Industrial OT \\u00b7 global', stage:'deployed', accent:C.cyan,\n    what:'Same platform applied to industrial operational technology, evidence that this is not a pharma-specific product.',\n    stats:[['Stage','Deployed'],['Domain','OT']],\n    body:'The addressable surface is not pharma. Industrial OT is the larger Physical AI estate and it runs on the same brownfield problem \\u2014 old protocols, long lifetimes, hard regulatory questions.',\n    list:[['Industrial OT deployment','beyond pharma'],['Same platform, no fork','one codebase'],['Expands the co-sell surface','OT + robotics']] },\n];\n\nconst ASKS = [\n  { id:'cosell', n:'1', label:'A co-sell conversation', color:C.aws,\n    sub:'Marketplace listing and the accounts we unblock together',\n    body:'Every deal we close runs on AWS and grows AWS consumption, because securing the fleet is what lets a regulated buyer put that data in the cloud at all. The question is whether that belongs in a co-sell motion.',\n    stats:[['Runs on','AWS'],['Overlap with AWS','none'],['Effect on AWS spend','grows with fleet'],['Ask','co-sell path']],\n    list:[['We remove the security-review blocker','regulated buyers'],['AWS captures the resulting workload','Bedrock, SageMaker, S3'],['Two production pharma references','Roche, Sandoz']] },\n  { id:'accounts', n:'2', label:'An intro to your enterprise accounts team', color:C.teal,\n    sub:'The accounts stuck on post-quantum, sovereignty or legacy fleets',\n    body:'The customers raising post-quantum, data sovereignty or \"we cannot re-flash that fleet\" are the ones we already have shipped answers for. One intro is the fastest way to test whether that is useful to you.',\n    stats:[['Best fit','EU regulated'],['Sales motion','security-review led'],['Reference sector','pharma + OT'],['Ask','one intro']],\n    list:[['Answers the PQC question directly','FIPS 204, shipped'],['Answers sovereignty with no caveats','customer-only custody'],['Through pharma procurement twice','not a research project']] },\n];\n\nfunction badge(text, color) {\n  return 'display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;flex-shrink:0;font:600 9.5px ' + MONO +\n    ';letter-spacing:.07em;text-transform:uppercase;color:' + color + ';background:' + color + '1F;border:1px solid ' + color + '4D';\n}\nfunction sColor(s) { return s === 'pass' ? C.emerald : s === 'warn' ? C.amber : C.red; }\n\nclass Component extends DCLogic {\n  state = { mode:'base', running:false, reached:-1, done:false, hoverStage:null, drawer:null, toast:null };\n\n  componentDidMount() { if (this.props.autoRun) this._boot = setTimeout(() => this.run(), 900); }\n  componentWillUnmount() { clearInterval(this._t); clearTimeout(this._tt); clearTimeout(this._boot); }\n\n  run = () => {\n    if (this.state.running) { clearInterval(this._t); this.setState({ running:false }); return; }\n    clearInterval(this._t);\n    this.setState({ running:true, reached:-1, done:false });\n    this._t = setInterval(() => {\n      const next = this.state.reached + 1;\n      if (next >= CHECKS.length) {\n        clearInterval(this._t);\n        this.setState({ running:false, done:true });\n        this.flash(this.state.mode === 'base' ? 'Scan complete \u2014 5 blockers on the estate as it stands' : 'Migration complete \u2014 5 of 5 cleared, no firmware touched');\n        return;\n      }\n      this.setState({ reached:next });\n    }, this.props.stepMs ?? 760);\n  };\n  onRun = () => this.run();\n  onReset = () => { clearInterval(this._t); this.setState({ running:false, reached:-1, done:false }); };\n  onMode = (e) => { clearInterval(this._t); this.setState({ mode:e.currentTarget.dataset.mode, running:false, reached:-1, done:false }); };\n  onRunFromHero = () => {\n    this.setState({ mode:'base', running:false, reached:-1, done:false });\n    const el = document.getElementById('scan');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 20, behavior:'smooth' });\n    clearTimeout(this._boot);\n    this._boot = setTimeout(() => this.run(), 520);\n  };\n  onNext = () => {\n    if (this.state.mode === 'base') {\n      clearInterval(this._t);\n      this.setState({ mode:'av', running:false, reached:-1, done:false });\n      setTimeout(() => this.run(), 130);\n      return;\n    }\n    const el = document.getElementById('ask');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 20, behavior:'smooth' });\n  };\n\n  onStageEnter = (e) => this.setState({ hoverStage:e.currentTarget.dataset.id });\n  onStageLeave = () => this.setState({ hoverStage:null });\n  onClose = () => this.setState({ drawer:null });\n  onBook = () => window.open('https://cal.com/agenticvaults', '_blank', 'noopener');\n  flash(msg) { this.setState({ toast:msg }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast:null }), 2700); }\n  open = (d) => this.setState({ drawer:d });\n\n  onOpenStage = (e) => {\n    const s = STAGES.find(x => x.id === e.currentTarget.dataset.id);\n    if (!s) return;\n    const accent = s.own === 'ours' ? C.teal : s.own === 'aws' ? C.aws : C.dim;\n    this.open({\n      kind: s.own === 'ours' ? 'Our product layer' : s.own === 'aws' ? 'AWS layer' : 'The estate',\n      title:s.name.replace('&amp;', '&'), sub:s.role.replace('&amp;', '&'),\n      badge: s.own         headline: 'The layer no other security company has. The reason this is Physical AI, not IoT security.',
        body: 'DualPoly is the architecture where AI inference runs natively inside the same lattice structure used for post-quantum key exchange. Inference and cryptography share a mathematical substrate — they are not bolted together. The result is sovereign AI reasoning that never leaves the secure enclave, works fully offline, and is cryptographically bound to the evidence it reasons over.',
        points: [
          { t: 'DualPoly architecture', s: 'inference runs inside the ML-KEM lattice — not alongside it' },
          { t: 'Ring Neural Inference', s: 'cryptographically-native intelligence — the decision and its proof are the same object' },
          { t: 'Anomaly detection', s: 'models threats and detects deviations without leaving the secure enclave' },
          { t: 'Sovereign decisions', s: 'autonomous choices that stay inside the customer\'s boundary — never on a third-party server' },
          { t: 'AWS Bedrock compatible', s: 'the evidence layer feeds Bedrock for cloud inference when connectivity exists' },
        ]
      }
    ];

    function buildSection() {
      var html = '<section style="border-top:1px solid #252535;padding:clamp(36px,4.4vw,64px) clamp(16px,3vw,40px)" id="av-stack-section">';
      html += '<div style="max-width:1340px;margin:0 auto">';

      // Section header
      html += '<div style="max-width:760px;margin-bottom:32px">';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:15px">';
      html += '<span style="height:1px;width:30px;background:' + AWS + '"></span>';
      html += '<span style="font:700 11px ' + DISP + ';letter-spacing:.13em;text-transform:uppercase;color:' + AWS + '">The full stack</span>';
      html += '</div>';
      html += '<h2 style="margin:0;font:700 clamp(22px,2.6vw,32px)/1.13 ' + DISP + ';letter-spacing:-.022em;color:' + WHITE + '">Three layers. Each one does something AWS IoT doesn\'t.</h2>';
      html += '<p style="margin:13px 0 0;font:400 clamp(13.5px,1.1vw,15.5px)/1.6 ' + SANS + ';color:' + MUTED + ';max-width:680px;text-wrap:pretty">SENTINEL is the indigenous cryptographic substrate. The Edge SDK, PQC Migration and FleetCam are where it meets the physical world. OODA Ring Neural Inference is where it becomes sovereign AI. AWS carries and computes on what all three produce.</p>';
      html += '</div>';

      // Layer cards
      html += '<div style="display:flex;flex-direction:column;gap:14px">';
      for (var i = 0; i < LAYERS.length; i++) {
        var L = LAYERS[i];
        html += '<div style="border:1px solid ' + L.border + ';border-radius:16px;background:' + L.bg + ';overflow:hidden">';

        // Card header
        html += '<div style="padding:18px 22px 16px;border-bottom:1px solid rgba(255,255,255,.05)">';
        html += '<div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">';
        html += '<span style="font:700 11px ' + MONO + ';letter-spacing:.08em;color:#0A0A11;background:' + L.color + ';padding:3px 10px;border-radius:5px;flex-shrink:0;margin-top:2px">' + L.n + '</span>';
        html += '<div style="flex:1;min-width:0">';
        html += '<div style="font:700 clamp(14px,1.35vw,16.5px) ' + DISP + ';letter-spacing:-.014em;color:' + WHITE + '">' + L.label + '</div>';
        html += '<div style="font:400 10.5px ' + MONO + ';letter-spacing:.05em;color:' + L.color + ';margin-top:5px">' + L.tag + '</div>';
        html += '</div>';
        html += '</div>';
        // Headline + body inside header padding
        html += '<div style="margin-top:13px">';
        html += '<div style="font:600 clamp(13px,1.1vw,14.5px)/1.5 ' + DISP + ';color:' + WHITE + ';margin-bottom:7px">' + L.headline + '</div>';
        html += '<p style="margin:0;font:400 clamp(12.5px,1vw,14px)/1.65 ' + SANS + ';color:' + MUTED + ';max-width:780px;text-wrap:pretty">' + L.body + '</p>';
        html += '</div>';
        html += '</div>';

        // Detail grid
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:rgba(255,255,255,.04)">';
        for (var j = 0; j < L.points.length; j++) {
          var P = L.points[j];
          html += '<div style="background:#0A0A11;padding:12px 16px">';
          html += '<div style="font:600 12px ' + DISP + ';color:' + L.color + '">' + P.t + '</div>';
          html += '<div style="font:400 11px/1.5 ' + SANS + ';color:' + DIM + ';margin-top:4px">' + P.s + '</div>';
          html += '</div>';
        }
        html += '</div>';
        html += '</div>'; // card
      }
      html += '</div>'; // layer cards

      // AWS alignment callout
      html += '<div style="margin-top:20px;padding:18px 22px;border-radius:14px;border:1px solid ' + AWS_BORDER + ';background:' + AWS_DIM + '">';
      html += '<div style="display:flex;align-items:flex-start;gap:12px">';
      html += '<span style="font:700 9px ' + MONO + ';letter-spacing:.12em;text-transform:uppercase;color:' + AWS + ';flex-shrink:0;padding-top:2px">AWS ALIGNMENT</span>';
      html += '<p style="margin:0;font:400 clamp(12.5px,1vw,14px)/1.65 ' + SANS + ';color:' + MUTED + ';text-wrap:pretty">SENTINEL\'s hybrid key exchange sits alongside <span style="color:' + WHITE + ';font-weight:600">AWS KMS\'s own ML-KEM support</span> — no conflict, full compatibility. The secured, post-quantum data that SENTINEL produces is what AWS IoT Core and Greengrass carry upstream. The evidence layer feeds <span style="color:' + WHITE + ';font-weight:600">Amazon Bedrock</span> for regulated customers who need cloud inference. The three layers don\'t compete with AWS — they are what makes a regulated enterprise buyer willing to send data to AWS at all.</p>';
      html += '</div>';
      html += '</div>';

      html += '</div></section>';
      return html;
    }

    function inject() {
      if (document.getElementById('av-stack-section')) return;
      // Insert before the "Shipped, not roadmapped" / customer references section
      var sections = document.querySelectorAll('section');
      var target = null;
      for (var i = 0; i < sections.length; i++) {
        var txt = sections[i].textContent;
        if (txt.indexOf('Shipped, not roadmapped') !== -1 ||
            txt.indexOf('Through pharma procurement') !== -1) {
          target = sections[i];
          break;
        }
      }
      if (!target) {
        target = document.getElementById('ask');
      }
      if (!target) return;
      var wrapper = document.createElement('div');
      wrapper.innerHTML = buildSection();
      target.parentNode.insertBefore(wrapper.firstChild, target);
    }

    if (document.body) inject();
    var obs = new MutationObserver(function() { if (document.body) inject(); });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener('load', function() {
      inject();
      setTimeout(inject, 500);
      setTimeout(inject, 1500);
    });
  })();
  </script>

  <!-- Floating booking CTA — injected after bundler DOM swap -->
  <script>
  (function() {
    var CAL_URL = 'https://cal.com/agenticvaults';
    var ACCENT = '#FF9900';
    var ACCENT_DARK = '#1A0A00';
    var ACCENT_HOVER = '#FFB133';

    function injectBtn() {
      if (document.getElementById('__av_book_btn')) return;
      var btn = document.createElement('a');
      btn.id = '__av_book_btn';
      btn.href = CAL_URL;
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.setAttribute('aria-label', 'Book 15 minutes with agenticvaults');
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Book 15 min</span>';
      btn.style.cssText = [
        'position:fixed',
        'bottom:24px',
        'right:24px',
        'z-index:9998',
        'display:inline-flex',
        'align-items:center',
        'gap:8px',
        'height:44px',
        'padding:0 20px',
        'border-radius:22px',
        'background:' + ACCENT,
        'color:' + ACCENT_DARK,
        'font:700 13.5px -apple-system,BlinkMacSystemFont,"Space Grotesk",sans-serif',
        'letter-spacing:.02em',
        'text-decoration:none',
        'box-shadow:0 4px 20px rgba(255,153,0,.35)',
        'transition:background .15s,box-shadow .15s,transform .15s',
        '-webkit-font-smoothing:antialiased',
        'cursor:pointer',
        'white-space:nowrap',
      ].join(';');
      btn.addEventListener('mouseenter', function() {
        btn.style.background = ACCENT_HOVER;
        btn.style.boxShadow = '0 6px 28px rgba(255,153,0,.5)';
        btn.style.transform = 'translateY(-1px)';
      });
      btn.addEventListener('mouseleave', function() {
        btn.style.background = ACCENT;
        btn.style.boxShadow = '0 4px 20px rgba(255,153,0,.35)';
        btn.style.transform = '';
      });
      /* Mobile: push up if viewport is narrow */
      var style = document.createElement('style');
      style.textContent = '@media(max-width:480px){#__av_book_btn{bottom:16px;right:16px;height:40px;padding:0 16px;font-size:12.5px}}';
      (document.head || document.documentElement).appendChild(style);
      document.body.appendChild(btn);
    }

    /* Try immediately (page already ready) then watch for bundler DOM swap */
    if (document.body) injectBtn();
    var observer = new MutationObserver(function() {
      if (document.body) injectBtn();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    /* Fallback: poll briefly after load */
    window.addEventListener('load', function() {
      injectBtn();
      setTimeout(injectBtn, 500);
      setTimeout(injectBtn, 1500);
    });
  })();
  </script>
